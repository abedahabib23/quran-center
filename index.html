  // كل تعديل بيظهر فوراً بكل الصفحات المحفوظة، ولما ينبعت بتتحدّث من الشيت

  const numOr = v => { const n = Number(toLatin(v)); return String(v == null ? '' : v).trim() !== '' && n >= 0 ? n : ''; };
  const idOf = v => (v === '' || v == null ? '' : isTemp(v) ? v : Number(v));

  function localStudent(id, data, noCommit) {
    const old = S.students.find(x => same(x.id, id)) || {};
    const hal = S.halaqat.find(x => same(x.id, data.halaqaId));
    const rec = Object.assign({}, old, {
      id, name: String(data.name || '').trim().replace(/\s+/g, ' '), nationalId: toLatin(data.nationalId).replace(/\D/g, ''),
      birthDate: data.birthDate || '', stage: data.stage || (hal && hal.stage) || '', guardianPhone: toLatin(data.guardianPhone).replace(/[^\d+]/g, ''),
      guardianId: toLatin(data.guardianId).replace(/\D/g, ''), guardianName: String(data.guardianName || '').trim(),
      guardianRelation: data.guardianRelation || '', halaqaId: idOf(data.halaqaId),
      juzCount: numOr(data.juzCount), lastAchievement: String(data.lastAchievement || '').trim(),
      sardJuz: numOr(data.sardJuz), sardDetails: String(data.sardDetails || '').trim(), area: String(data.area || '').trim(),
      joinDate: data.joinDate || S.today, status: data.status || 'فعّال', notes: String(data.notes || '').trim(),
    });
    upsert(S.students, rec);
    const h = S.halaqat.find(x => same(x.id, rec.halaqaId)) || null;
    patchReads('students.list', list => {
      const row = list.find(x => same(x.id, id));
      if (row) Object.assign(row, rec, { halaqaName: h ? h.name : '' });
      else list.push(Object.assign({}, rec, { halaqaName: h ? h.name : '', lastReport: null, attendance: null }));
    });
    const sg = readOf('students.get', { id });
    if (sg) { Object.assign(sg.student, rec); sg.halaqa = h; }
    else putRead(keyOf('students.get', { id }), { student: rec, halaqa: h, reports: [] });
    patchReads('halaqat.get', d => {
      const i = d.students.findIndex(x => same(x.id, id));
      const inIt = same(d.halaqa.id, rec.halaqaId);
      if (i >= 0 && !inIt) d.students.splice(i, 1);
      else if (i >= 0) Object.assign(d.students[i], rec);
      else if (inIt) d.students.push(Object.assign({}, rec, { lastReport: null, attendance: null }));
    });
    if (!noCommit) commitLocal();
  }

  function localUser(id, data, u) {
    const nid = toLatin(data.nationalId).replace(/\D/g, '');
    const rec = Object.assign({}, u, {
      id, name: String(data.name || '').trim(), role: data.role, nationalId: nid || u.nationalId || '', username: nid || u.username || '',
      active: data.active !== false, phone: toLatin(data.phone).replace(/[^\d+]/g, ''),
    });
    ['maritalStatus', 'juzCount', 'kafalaNote', 'workType', 'course', 'job', 'housing', 'bank', 'wallet', 'payPhone', 'birthDate']
      .forEach(k => { if (k in data) rec[k] = String(data[k] == null ? '' : data[k]).trim(); });
    delete rec.password; delete rec.resetToId;
    patchReads('users.list', list => {
      const i = list.findIndex(x => same(x.id, id));
      if (i >= 0) Object.assign(list[i], rec); else list.push(Object.assign({ mustChange: true }, rec));
    });
    const ug = readOf('users.get', { id });
    if (ug) Object.assign(ug.user, rec);
    else putRead(keyOf('users.get', { id }), { user: Object.assign({ mustChange: true }, rec), halaqat: [], submissions: [], kafalat: [] });
    S.teachers = S.teachers.filter(t => !same(t.id, id));
    if ((rec.role === ROLE.TEACHER || AMIRS.includes(rec.role)) && rec.active) S.teachers.push({ id, name: rec.name });
    S.halaqat.forEach(h => { if (same(h.teacherId, id)) h.teacherName = rec.name; });
    if (same(id, S.user.id)) S.user.name = rec.name;
    commitLocal();
  }

  function localPeriod(p) {
    const t = S.today;
    const status = t < p.startDate ? 'قادمة' : t > p.endDate ? 'مغلقة' : 'مفتوحة';
    const pd = {
      id: p.id, month: p.month, startDate: p.startDate, endDate: p.endDate, notes: String(p.notes || '').trim(), status,
      daysLeft: status === 'مفتوحة' ? Math.round((toDate(p.endDate) - toDate(t)) / 864e5) + 1 : null,
    };
    let base = null;
    patchReads('reports.month', d => {
      const i = d.periods.findIndex(x => x.month === pd.month);
      if (i >= 0) d.periods[i] = pd;
      else { d.periods.push(pd); d.periods.sort((a, b) => (a.month < b.month ? 1 : -1)); }
      if (d.month === pd.month) d.period = pd;
      base = base || d;
    });
    if (base) S.periodsCache = base.periods;
    // شهر ما انفتحت صفحته قبل: بنجهّزها من نسخة شهر تاني
    if (base && !readOf('reports.month', { month: pd.month })) {
      putRead(keyOf('reports.month', { month: pd.month }), Object.assign({}, base, {
        month: pd.month, period: pd,
        halaqat: base.halaqat.map(h => Object.assign({}, h, { submitted: false, submittedAt: '', pending: false, ayatSum: 0, attendance: null })),
      }));
    }
    patchReads('dashboard', d => { if (d.teaching && d.teaching.period && d.teaching.period.month === pd.month) d.teaching.period = pd; });
    commitLocal();
  }

  function localTx(id, data, amount, sponsors, kafalat, old) {
    const k = data.type === 'دفعة كفالة' ? kafalat.find(x => same(x.id, data.kafalaId)) : null;
    const sp = k ? sponsors.find(x => same(x.id, k.sponsorId)) : data.type === 'تبرع' ? sponsors.find(x => same(x.id, data.sponsorId)) : null;
    const reward = data.type === 'مكافأة';
    const ben = reward ? (data.beneficiaryKind === 'محفظ' ? S.teachers : S.students).find(x => same(x.id, data.beneficiaryId)) : null;
    const rec = Object.assign({}, old, {
      id, date: data.date || S.today, type: data.type, amount,
      category: String(data.category || '').trim() || (k ? 'كفالة' : reward ? 'مكافأة' : data.type === 'مصروف' ? 'أخرى' : 'تبرع عام'),
      sponsorId: sp ? sp.id : '', sponsorName: sp ? sp.name : '', kafalaId: k ? k.id : '', method: data.method || '',
      receipt: String(data.receipt || '').trim(), notes: String(data.notes || '').trim(), byUser: old.byUser || S.user.name,
      beneficiaryKind: ben ? data.beneficiaryKind : '', beneficiaryId: ben ? ben.id : '', beneficiaryName: ben ? ben.name : '',
    });
    // المكافأة بتظهر فوراً بصفحة الطالب أو المحفّظ
    [['students.get', 'طالب'], ['users.get', 'محفظ']].forEach(([action, kind]) => patchReads(action, d => {
      if (!d.rewards) return;
      d.rewards = d.rewards.filter(x => !same(x.id, id));
      if (ben && data.beneficiaryKind === kind && same((d.student || d.user).id, ben.id)) d.rewards.unshift(rec);
    }));
    patchReads('transactions.list', (list, key) => {
      const i = list.findIndex(x => same(x.id, id));
      if (i >= 0) list.splice(i, 1);
      if (key.endsWith('=all') || key.endsWith('month=' + rec.date.slice(0, 7))) {
        list.push(rec);
        list.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
      }
    });
    commitLocal();
  }

  /* ═════════ التصدير إلى إكسل ═════════ */
  // ملف xlsx بيتجهّز على الجهاز نفسه (فبيشتغل بدون إنترنت): جدول من اليمين لليسار، عمود ترقيم،
  // صف عناوين أصفر عريض، وحدود لكل الخلايا، والخانة الفاضية بتطلع «-»

  const NS = 'http:\/\/schemas.openxmlformats.org/';
  const XML_HEAD = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const xmlEsc = v => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const colName = i => { let s = ''; for (let n = i + 1; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + ((n - 1) % 26)) + s; return s; };
  const xnum = v => (v === '' || v == null || isNaN(Number(v)) ? '' : Number(v));

  // الأعمدة: [{ label, name: true للعمود العريض (الاسم) }] أو نصوص
  function exportXlsx(fileName, sheetName, columns, rows) {
    const cols = [{ label: '#' }].concat(columns.map(c => (typeof c === 'string' ? { label: c } : c)));
    const data = rows.map((r, i) => [i + 1].concat(r));
    const serial = ymd => { const [y, m, d] = ymd.split('-').map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; };
    const str = (ref, s, text) => `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(text)}</t></is></c>`;
    // الأنماط: 1 العنوان، 2 خلية عادية بالنص، 3 الاسم (عريض)، 4 تاريخ
    const cell = (v, ref, col) => {
      if (v === '' || v == null) return `<c r="${ref}" s="2" t="inlineStr"><is><t>-</t></is></c>`;
      if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}" s="2"><v>${v}</v></c>`;
      const s = String(v);
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return `<c r="${ref}" s="4"><v>${serial(s)}</v></c>`;
      return str(ref, col.name ? 3 : 2, s);
    };
    const width = (c, i) => {
      const longest = Math.max(String(c.label).length, ...data.slice(0, 500).map(r => String(r[i] == null ? '' : r[i]).length));
      return i === 0 ? 5 : Math.min(55, Math.round(longest * 1.2 + 4));
    };
    const last = colName(cols.length - 1) + (data.length + 1);
    const safeName = String(sheetName).replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31) || 'Sheet1';
    const sheet = XML_HEAD + `<worksheet xmlns="${NS}spreadsheetml/2006/main" xmlns:r="${NS}officeDocument/2006/relationships">`
      + '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>'
      + `<dimension ref="A1:${last}"/>`
      + '<sheetViews><sheetView rightToLeft="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
      + '<sheetFormatPr defaultRowHeight="22" customHeight="1"/>'
      + `<cols>${cols.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${width(c, i)}" customWidth="1"/>`).join('')}</cols>`
      + `<sheetData><row r="1" ht="28" customHeight="1">${cols.map((c, i) => str(colName(i) + '1', 1, c.label)).join('')}</row>`
      + data.map((r, ri) => `<row r="${ri + 2}">${cols.map((c, i) => cell(r[i], colName(i) + (ri + 2), c)).join('')}</row>`).join('')
      + '</sheetData>'
      + '<pageMargins left="0.3" right="0.3" top="0.4" bottom="0.4" header="0.2" footer="0.2"/>'
      + '<pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/>'
      + `<ignoredErrors><ignoredError sqref="A1:${last}" numberStoredAsText="1"/></ignoredErrors>`
      + '</worksheet>';
    const styles = XML_HEAD + `<styleSheet xmlns="${NS}spreadsheetml/2006/main">`
      + '<numFmts count="1"><numFmt numFmtId="164" formatCode="d/m/yyyy"/></numFmts>'
      + '<fonts count="2"><font><sz val="12"/><color rgb="FF000000"/><name val="Arial"/></font><font><b/><sz val="12"/><color rgb="FF000000"/><name val="Arial"/></font></fonts>'
      + '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'
      + '<fill><patternFill patternType="solid"><fgColor rgb="FFFFFF00"/><bgColor indexed="64"/></patternFill></fill></fills>'
      + '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>'
      + '<border><left style="thin"><color rgb="FF000000"/></left><right style="thin"><color rgb="FF000000"/></right><top style="thin"><color rgb="FF000000"/></top><bottom style="thin"><color rgb="FF000000"/></bottom><diagonal/></border></borders>'
      + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
      + '<cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
      + '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'
      + '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'
      + '<xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>'
      + '<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'
      + '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
    const rel = (id, type, target) => `<Relationship Id="${id}" Type="${NS}officeDocument/2006/relationships/${type}" Target="${target}"/>`;
    const rels = list => XML_HEAD + `<Relationships xmlns="${NS}package/2006/relationships">${list.join('')}</Relationships>`;
    const files = [
      ['[Content_Types].xml', XML_HEAD + `<Types xmlns="${NS}package/2006/content-types">`
        + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>'
        + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
        + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
        + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
      ['_rels/.rels', rels([rel('rId1', 'officeDocument', 'xl/workbook.xml')])],
      // صف العناوين بيتكرّر بكل صفحة عند الطباعة من إكسل
      ['xl/workbook.xml', XML_HEAD + `<workbook xmlns="${NS}spreadsheetml/2006/main" xmlns:r="${NS}officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(safeName)}" sheetId="1" r:id="rId1"/></sheets>`
        + `<definedNames><definedName name="_xlnm.Print_Titles" localSheetId="0">'${xmlEsc(safeName.replace(/'/g, "''"))}'!$1:$1</definedName></definedNames></workbook>`],
      ['xl/_rels/workbook.xml.rels', rels([rel('rId1', 'worksheet', 'worksheets/sheet1.xml'), rel('rId2', 'styles', 'styles.xml')])],
      ['xl/worksheets/sheet1.xml', sheet],
      ['xl/styles.xml', styles],
    ];
    downloadBlob(zipFiles(files), fileName.replace(/[\\\/:*?"<>|]/g, '-'));
  }

  // ملف zip بسيط (بدون ضغط)، وهو اللي جوّا أي ملف xlsx
  const CRC_TABLE = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc32 = bytes => { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zipFiles(files) {
    const enc = new TextEncoder(), parts = [], central = [];
    let offset = 0;
    files.forEach(([fname, text]) => {
      const name = enc.encode(fname), data = typeof text === 'string' ? enc.encode(text) : text, crc = crc32(data);
      const head = new DataView(new ArrayBuffer(30));
      head.setUint32(0, 0x04034b50, true); head.setUint16(4, 20, true); head.setUint16(6, 0x0800, true);
      head.setUint16(12, 0x21, true); head.setUint32(14, crc, true);
      head.setUint32(18, data.length, true); head.setUint32(22, data.length, true); head.setUint16(26, name.length, true);
      parts.push(head, name, data);
      const cen = new DataView(new ArrayBuffer(46));
      cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true); cen.setUint16(8, 0x0800, true);
      cen.setUint16(14, 0x21, true); cen.setUint32(16, crc, true); cen.setUint32(20, data.length, true); cen.setUint32(24, data.length, true);
      cen.setUint16(28, name.length, true); cen.setUint32(42, offset, true);
      central.push(cen, name);
      offset += 30 + name.length + data.length;
    });
    const size = central.reduce((n, p) => n + p.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, size, true); end.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [end]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast('جُهّز ملف إكسل: ' + name);
  }

  function exportStudents() {
    const rows = filteredStudents();
    if (!rows.length) { toast('لا يوجد طلاب للتصدير', 'error'); return; }
    exportXlsx(`الطلاب ${S.today}.xlsx`, 'الطلاب', [
      { label: 'اسم الطالب', name: true }, 'رقم الهوية', 'تاريخ الميلاد', 'المرحلة', 'الحلقة', 'الحالة', 'ولي الأمر', 'صلة القرابة',
      'هوية ولي الأمر', 'رقم الجوال', 'عدد أجزاء الحفظ', 'آخر إنجاز', 'عدد أجزاء السرد', 'تفصيل أجزاء السرد', 'الحضور في آخر تقرير',
      'المحلية', 'تاريخ الانضمام', 'ملحوظات',
    ], rows.map(s => [s.name, s.nationalId, s.birthDate, s.stage, s.halaqaName || halaqaName(s.halaqaId), s.status, s.guardianName,
      s.guardianRelation, s.guardianId, s.guardianPhone, xnum(s.juzCount), s.lastAchievement, xnum(s.sardJuz), s.sardDetails,
      s.attendance == null ? '' : s.attendance + '%', s.area, s.joinDate, s.notes]));
  }

  // نفس ترتيب كشف المحفّظين المعتمد بالمركز، وبيانات الدفع للمدير بس
  function exportTeachers() {
    const list = teachersOf(S.usersCache || []);
    if (!list.length) { toast('لا يوجد محفّظون للتصدير', 'error'); return; }
    const pay = is(ROLE.ADMIN);
    const cols = [{ label: 'اسم المحفظ', name: true }, 'عدد أجزاء الحفظ', 'الحالة الاجتماعية', 'طبيعة العمل في المركز', 'الكفالة',
      'تاريخ الميلاد', 'رقم الهوية', 'رقم الجوال', 'العمل', 'وضع البيت'].concat(pay ? ['بنك', 'محفظة', 'جوال'] : [], ['الدورة المتقنة', 'الحلقة']);
    exportXlsx(`المحفظون ${S.today}.xlsx`, 'المحفظون', cols, list.map(u => [u.name, xnum(u.juzCount), u.maritalStatus, u.workType, u.kafalaNote,
      u.birthDate, u.nationalId, u.phone, u.job, u.housing].concat(pay ? [u.bank, u.wallet, u.payPhone] : [], [u.course, halaqaOf(u.id)])));
  }

  const REPORT_COLS = ['من سورة', 'من آية', 'إلى سورة', 'إلى آية', 'عدد الآيات'];
  const rangeCells = r => (r.fromSurah && r.toSurah ? [surahName(r.fromSurah), xnum(r.fromAyah), surahName(r.toSurah), xnum(r.toAyah)] : ['', '', '', '']);

  function exportReport() {
    const d = S.reportCache;
    if (!d || !d.entries.length) return;
    exportXlsx(`تقرير ${d.halaqa.name} ${d.month}.xlsx`, fMonth(d.month), [{ label: 'الطالب', name: true }].concat(REPORT_COLS,
      ['الحفظ هذا الشهر (أجزاء تقريباً)', 'السرد هذا الشهر', 'أيام الحضور', 'أيام الغياب', 'التقدير', 'ملحوظات']),
    d.entries.map(e => {
      const has = e.fromSurah && e.fromAyah && e.toSurah && e.toAyah;
      const r = has ? rangeInfo(+e.fromSurah, +e.fromAyah, +e.toSurah, +e.toAyah) : null;
      return [e.studentName].concat(rangeCells(e), [r ? r.ayat : '', r ? Math.round(r.juz * 10) / 10 : '',
        (e.sardMonth || []).map(j => 'جزء ' + j).join('، '), xnum(e.presentDays), xnum(e.absentDays), e.grade, e.notes]);
    }));
  }

  async function exportMonth(month) {
    let rows;
    try { rows = await load('reports.export', { month }); } catch (e) { toast(e.message, 'error'); return; }
    if (!rows.length) { toast(`لا توجد تقارير مسلّمة لشهر ${fMonth(month)}`, 'error'); return; }
    exportXlsx(`تقارير ${month}.xlsx`, fMonth(month), ['الحلقة', 'المحفظ', { label: 'الطالب', name: true }, 'المرحلة'].concat(REPORT_COLS,
      ['مجموع أجزاء الحفظ', 'آخر إنجاز', 'السرد هذا الشهر', 'مجموع أجزاء السرد', 'أيام الحضور', 'أيام الغياب', 'التقدير', 'ملحوظات']),
    rows.map(r => [r.halaqaName, r.teacherName, r.studentName, r.stage].concat(rangeCells(r), [xnum(r.ayatCount), xnum(r.juzCount),
      r.lastAchievement, (r.sardMonth || []).map(j => 'جزء ' + j).join('، '), xnum(r.sardJuz), xnum(r.presentDays), xnum(r.absentDays), r.grade, r.notes])));
  }

  /* ═════════ النوافذ ═════════ */

  let modal = null;
  function openModal(o) {
    closeModal();
    const root = document.createElement('div');
    root.className = 'modal-back';
    root.innerHTML = html`<div class="modal ${o.cls || ''}" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <form data-form="modal" novalidate>
        <div class="modal-head"><h2 id="mTitle">${o.title}</h2>
          ${o.locked ? '' : html`<button type="button" class="icon-btn" data-act="close-modal" aria-label="إغلاق">${icon('x')}</button>`}</div>
        <div class="modal-body">${o.body}<p class="form-error" hidden></p></div>
        ${o.onSubmit ? html`<div class="modal-foot"><button class="btn ${o.danger ? 'danger' : ''}" type="submit">${o.submitLabel || 'حفظ'}</button>
          ${o.locked ? html`<button type="button" class="btn ghost" data-act="logout">خروج</button>` : html`<button type="button" class="btn secondary" data-act="close-modal">${o.cancelLabel || 'إلغاء'}</button>`}</div>` : ''}
      </form></div>`;
    document.body.appendChild(root);
    modal = { root, o, prev: document.activeElement };
    root.addEventListener('mousedown', e => { if (e.target === root && !o.locked) closeModal(); });
    setTimeout(() => {
      const f = root.querySelector('.modal-body input:not([type=hidden]):not([type=radio]):not([type=checkbox]), .modal-body select, .modal-body textarea') || root.querySelector('button');
      if (f) f.focus();
    }, 30);
    return root.querySelector('form');
  }

  function closeModal(submitted) {
    if (!modal) return;
    const m = modal;
    modal = null;
    m.root.remove();
    if (!submitted && m.o.onCancel) m.o.onCancel();
    if (m.prev && m.prev.isConnected && m.prev.focus) m.prev.focus();
  }

  async function submitModal(form) {
    const m = modal;
    if (!m) return;
    const invalid = $$('[required]', form).find(el => !el.closest('[hidden]') && !String(el.value).trim());
    const err = $('.modal-body > .form-error', form);
    if (invalid) {
      err.textContent = `يرجى تعبئة حقل «${(invalid.closest('.field') && $('span', invalid.closest('.field')).textContent) || 'مطلوب'}»`;
      err.hidden = false; invalid.focus();
      return;
    }
    const btn = $('button[type=submit]', form);
    err.hidden = true; btn.disabled = true;
    try {
      await m.o.onSubmit(formData(form), form);
      if (!m.o.keepOpen && modal === m) closeModal(true);
    } catch (e) {
      err.textContent = e.message; err.hidden = false;
    } finally {
      if (btn.isConnected) btn.disabled = false;
    }
  }

  function confirmBox(message, okLabel = 'حذف') {
    return new Promise(resolve => {
      openModal({
        title: 'تأكيد', cls: 'narrow', danger: true, submitLabel: okLabel,
        body: html`<p>${message}</p>`,
        onSubmit: async () => resolve(true),
        onCancel: () => resolve(false),
      });
    });
  }

  function formData(form) {
    const o = {};
    new FormData(form).forEach((v, k) => { o[k] = k in o ? [].concat(o[k], v) : v; });
    $$('input[type=checkbox][data-bool]', form).forEach(c => { o[c.name] = c.checked; });
    $$('input[type=checkbox][data-multi]', form).forEach(c => { o[c.name] = o[c.name] ? [].concat(o[c.name]) : []; });
    return o;
  }

  /* ═════════ الأحداث ═════════ */

  const ACTIONS = {
    'logout': () => signOut(),
    'sync': () => syncSheet(),
    'app-hint-hide': () => { store.set('qc_app_hint', '1'); refreshView(); },
    'app-install': async () => {
      if (!installPrompt) return;
      closeModal();
      installPrompt.prompt();
      const r = await installPrompt.userChoice.catch(() => null);
      installPrompt = null;
      if (r && r.outcome === 'accepted') { store.set('qc_app_hint', '1'); toast('ثُبّت التطبيق على جهازك'); }
      refreshView();
    },
    'page': el => { S.pages[el.dataset.key] = Number(el.dataset.page); repage(el.dataset.key); },
    'sel-all': () => { filteredStudents().forEach(s => S.selected.add(String(s.id))); renderStudentRows(); },
    'sel-clear': () => { S.selected.clear(); renderStudentRows(); },
    'bulk-edit': () => bulkForm(),
    'bulk-del': async () => {
      const ids = [...S.selected];
      if (!ids.length) return;
      if (!(await confirmBox(`هل تريد حذف ${nStudents(ids.length)}؟ تبقى تقاريرهم السابقة محفوظة في الشيت.`, 'حذف المحدّدين'))) return;
      mutate('students.deleteMany', { ids: ids.map(idOf) }, { label: `حذف ${nStudents(ids.length)}` });
      ids.forEach(removeStudentLocal);
      commitLocal();
      toast(savedMsg(`حُذف ${nStudents(ids.length)}`));
      refreshView();
    },
    'export-students': () => exportStudents(),
    'export-teachers': () => exportTeachers(),
    'export-report': () => exportReport(),
    'export-month': el => exportMonth(el.dataset.month),
    'password': () => passwordForm(),
    'account': () => accountSheet(false),
    'more': () => accountSheet(true),
    'close-modal': () => closeModal(),
    'reload': () => reload(),
    'period-new': el => periodForm(el.dataset.month ? { month: el.dataset.month } : null),
    'period-edit': el => periodForm((S.periodsCache || []).find(p => p.month === el.dataset.month)),
    'period-del': async el => {
      const pd = (S.periodsCache || []).find(p => p.month === el.dataset.month);
      if (!pd) return;
      if (!(await confirmBox(`هل تريد حذف فترة إدخال تقرير ${fMonth(pd.month)}؟ لن يتمكن المحفّظون من تعبئة تقرير هذا الشهر، وتبقى التقارير المسلّمة محفوظة.`, 'حذف الفترة'))) return;
      mutate('periods.delete', { id: idOf(pd.id) }, { label: 'حذف فترة تقرير ' + fMonth(pd.month) });
      patchReads('reports.month', d => {
        d.periods = d.periods.filter(x => x.month !== pd.month);
        if (d.period && d.period.month === pd.month) d.period = null;
        S.periodsCache = d.periods;
      });
      patchReads('dashboard', d => { if (d.teaching && d.teaching.period && d.teaching.period.month === pd.month) d.teaching.period = null; });
      patchReads('report.get', d => { if (d.month === pd.month) { d.period = null; d.editable = is(ROLE.ADMIN); } });
      commitLocal();
      toast(savedMsg('حُذفت الفترة'));
      refreshView();
    },
    'print-report': () => printReport(),
    'student-new': el => studentForm(el.dataset.halaqa ? { halaqaId: Number(el.dataset.halaqa) } : {}),
    'student-del': async el => {
      const s = S.students.find(x => same(x.id, el.dataset.id)) || { name: '' };
      if (!(await confirmBox(`هل تريد حذف الطالب «${s.name}»؟ تبقى تقاريره السابقة محفوظة في الشيت. وإذا ترك الطالب المركز، يمكنك بدلاً من الحذف تغيير حالته إلى «منسحب».`, 'حذف الطالب'))) return;
      const id = el.dataset.id;
      mutate('students.delete', { id: idOf(id) }, { label: 'حذف الطالب ' + s.name });
      removeStudentLocal(id);
      commitLocal();
      toast(savedMsg('حُذف الطالب'));
      if (S.route === 'student') go('students', {}, 'replace'); else refreshView();
    },
    'halaqa-del': async el => {
      if (!(await confirmBox(`هل تريد حذف «${el.dataset.name}»؟`, 'حذف الحلقة'))) return;
      const id = el.dataset.id;
      if (S.students.some(s => same(s.halaqaId, id))) { toast('في الحلقة طلاب. انقلهم إلى حلقة أخرى أو احذفهم أولاً.', 'error'); return; }
      mutate('halaqat.delete', { id: idOf(id) }, { label: 'حذف ' + el.dataset.name });
      S.halaqat = S.halaqat.filter(x => !same(x.id, id));
      reads.delete(keyOf('halaqat.get', { id }));
      commitLocal();
      toast(savedMsg('حُذفت الحلقة'));
      go('halaqat', {}, 'replace');
    },
    'user-del': async el => {
      if (!(await confirmBox(`هل تريد حذف حساب «${el.dataset.name}»؟ تبقى حلقاته دون محفّظ حتى تسندها لغيره، وتبقى تقاريره السابقة محفوظة.`, 'حذف الحساب'))) return;
      const id = el.dataset.id;
      mutate('users.delete', { id: idOf(id) }, { label: 'حذف حساب ' + el.dataset.name });
      S.teachers = S.teachers.filter(x => !same(x.id, id));
      S.halaqat.forEach(h => { if (same(h.teacherId, id)) { h.teacherId = ''; h.teacherName = ''; } });
      patchReads('users.list', list => { const i = list.findIndex(x => same(x.id, id)); if (i >= 0) list.splice(i, 1); });
      reads.delete(keyOf('users.get', { id }));
      commitLocal();
      toast(savedMsg('حُذف الحساب'));
      if (S.route === 'teacher') go('users', {}, 'replace'); else refreshView();
    },
    'teacher-edit': () => userForm(S.teacherCache),
    'students-import': () => importForm(),
    'student-edit': el => studentForm(S.students.find(s => same(s.id, el.dataset.id))),
    'halaqa-new': () => halaqaForm(),
    'halaqa-edit': el => halaqaForm(S.halaqat.find(h => same(h.id, el.dataset.id))),
    'user-new': () => userForm(),
    'teacher-new': () => userForm({ role: ROLE.TEACHER }),
    'teachers-import': () => teachersImportForm(),
    'user-edit': el => userForm((S.usersCache || []).find(u => same(u.id, el.dataset.id))),
    'tx-new': () => txForm().catch(e => toast(e.message, 'error')),
    'tx-edit': el => txForm((S.txCache || []).find(t => same(t.id, el.dataset.id))).catch(e => toast(e.message, 'error')),
    'tx-del': async el => {
      if (!(await confirmBox('هل تريد حذف هذه الحركة المالية؟ لا يمكن التراجع عن الحذف.'))) return;
      const id = el.dataset.id;
      mutate('transactions.delete', { id: idOf(id) }, { label: 'حذف حركة مالية' });
      patchReads('transactions.list', list => { const i = list.findIndex(x => same(x.id, id)); if (i >= 0) list.splice(i, 1); });
      commitLocal();
      toast(savedMsg('حُذفت الحركة'));
      reload();
    },
    'receipt': el => showReceipt((S.txCache || []).find(t => same(t.id, el.dataset.id))),
    'kafala-new': () => kafalaForm().catch(e => toast(e.message, 'error')),
    'kafala-edit': el => kafalaForm((S.kafalatCache || []).find(k => same(k.id, el.dataset.id))).catch(e => toast(e.message, 'error')),
    'kafala-pay': el => {
      const k = (S.kafalatCache || []).find(x => same(x.id, el.dataset.id));
      txForm({}, { type: 'دفعة كفالة', kafalaId: k.id, amount: k.monthly, category: 'كفالة' }).catch(e => toast(e.message, 'error'));
    },
    'reward-new': el => txForm({}, { type: 'مكافأة', beneficiaryKind: el.dataset.kind || 'طالب', beneficiaryId: el.dataset.id || '' }).catch(e => toast(e.message, 'error')),
    'sponsor-new': () => sponsorForm(),
    'sponsor-edit': el => sponsorForm((S.sponsorsCache || []).find(s => same(s.id, el.dataset.id))),
  };

  const CHANGES = {
    'rep-month': el => go('reports', { month: el.value }, 'replace'),
    'st-filter': () => {
      const f = S.params.filter;
      f.q = ($('#stQ') || {}).value || '';
      f.halaqa = ($('#stH') || {}).value || '';
      f.status = ($('#stS') || {}).value || '';
      f.stage = ($('#stG') || {}).value || '';
      S.pages.students = 1;
      renderStudentRows();
    },
    'sel-one': el => {
      if (el.checked) S.selected.add(el.dataset.id); else S.selected.delete(el.dataset.id);
      el.closest('.srow').classList.toggle('selected', el.checked);
      const head = $('#stList [data-change=sel-page]');
      if (head) head.checked = $$('#stList [data-change=sel-one]').every(x => x.checked);
      renderBulkBar();
    },
    'sel-page': el => {
      $$('#stList [data-change=sel-one]').forEach(x => { if (el.checked) S.selected.add(x.dataset.id); else S.selected.delete(x.dataset.id); });
      renderStudentRows();
    },
    'page-size': el => {
      pageSize = Number(el.value) || 25;
      store.set('qc_page_size', pageSize);
      const key = el.closest('[data-pager]').dataset.pager;
      S.pages = {};
      repage(key);
    },
    'fin-month': el => { if (el.value) go('finance', { tab: el.dataset.tab, month: el.value }, 'replace'); },
  };

  const FORMS = {
    login: submitLogin,
    report: submitReport,
    modal: submitModal,
  };

  function wireEvents() {
    document.addEventListener('click', e => {
      if (e.target.closest('a[target="_blank"]')) return; // روابط خارجية متل واتساب
      if (e.target.closest('.c-check')) return; // مربع التحديد جوّا صف الطالب
      const g = e.target.closest('[data-go]');
      const a = e.target.closest('[data-act]');
      // زر جوّا صف قابل للضغط: الزر بيشتغل بدل فتح الصف
      if (a && ACTIONS[a.dataset.act] && (!g || g.contains(a))) {
        e.preventDefault();
        ACTIONS[a.dataset.act](a, e);
        return;
      }
      if (g) {
        e.preventDefault();
        if (modal) closeModal();
        go(g.dataset.go, g.dataset.params ? JSON.parse(g.dataset.params) : {});
      }
    });
    document.addEventListener('submit', e => {
      const f = e.target.closest('form[data-form]');
      if (!f) return;
      e.preventDefault();
      if (FORMS[f.dataset.form]) FORMS[f.dataset.form](f, e);
    });
    document.addEventListener('change', e => {
      const t = e.target;
      if (t.dataset && t.dataset.change && CHANGES[t.dataset.change]) { CHANGES[t.dataset.change](t); return; }
      const form = t.form;
      if (!form) return;
      if (form.dataset.form === 'report') { form.classList.add('dirty'); onRepChange(t); updateRepLeft(); }
      if (form.dataset.form === 'modal' && (t.name === 'type' || t.name === 'beneficiaryKind') && form.beneficiaryId && form.querySelector('#catList')) syncTxForm(form);
      if (form.dataset.form === 'modal' && t.name === 'kind') syncKafalaForm(form);
      // نموذج الطالب: مرحلة الحلقة إذا ما انحدّدت مرحلة
      if (form.dataset.form === 'modal' && t.name === 'halaqaId' && form.stage && form.stage.tagName === 'SELECT' && !form.stage.value) {
        const h = S.halaqat.find(x => same(x.id, t.value));
        if (h && h.stage) form.stage.value = h.stage;
      }
    });
    let inputTimer;
    document.addEventListener('input', e => {
      const t = e.target;
      if (t.form && t.form.dataset.form === 'report') { t.form.classList.add('dirty'); updateRepLeft(); }
      if (t.hasAttribute && t.hasAttribute('data-import')) {
        clearTimeout(inputTimer);
        inputTimer = setTimeout(() => renderImportPreview(t), 200);
      }
      if (t.dataset && t.dataset.input && CHANGES[t.dataset.input]) {
        clearTimeout(inputTimer);
        inputTimer = setTimeout(() => CHANGES[t.dataset.input](t), 150);
      }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal && !modal.o.locked) closeModal(); });

    // تلميح صغير لما تمرّر الماوس على عنصر فيه data-tip
    const tip = document.createElement('div');
    tip.className = 'tip'; tip.hidden = true;
    document.body.appendChild(tip);
    const showTip = el => {
      tip.textContent = el.dataset.tip;
      tip.hidden = false;
      const r = el.getBoundingClientRect();
      const w = tip.offsetWidth, h = tip.offsetHeight;
      tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
      tip.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + 'px';
    };
    document.addEventListener('mouseover', e => {
      const el = e.target.closest('[data-tip]');
      if (el && el.dataset.tip) showTip(el); else tip.hidden = true;
    });
    document.addEventListener('focusin', e => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      if (el && el.dataset.tip) showTip(el); else tip.hidden = true;
    });
    window.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });
  }

  boot();
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
</body>
