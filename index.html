  }

  // تنبيه بالرئيسية: من رابط جوجل بنوجّه للتطبيق، ومن التطبيق بالمتصفح بنشرح التثبيت
  function appHint() {
    if (store.get('qc_app_hint') || standalone()) return '';
    if (APP_URL && !API_URL) {
      return html`<div class="notice app-hint"><div><strong>النظام يعمل دون إنترنت كتطبيق</strong>
        <p>رابط Google يحتاج إلى إنترنت ليُفتح. افتح النظام من رابط التطبيق وسجّل الدخول مرة واحدة، ثم ثبّته على جهازك ليُفتح ويعمل دون إنترنت.</p></div>
        <div class="ph-actions"><a class="btn sm" href="${APP_URL}" target="_blank" rel="noopener">فتح التطبيق</a><button class="btn sm ghost" data-act="app-hint-hide">إخفاء</button></div></div>`;
    }
    if (API_URL) {
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
      return html`<div class="notice app-hint"><div><strong>ثبّت التطبيق على جهازك</strong>
        <p>${installPrompt ? 'يُضاف النظام إلى الشاشة الرئيسية كتطبيق، ويُفتح دون إنترنت.'
          : ios ? 'من متصفح Safari اضغط زر المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية».'
          : 'من قائمة المتصفح ⋮ اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».'}</p></div>
        <div class="ph-actions">${installPrompt ? html`<button class="btn sm" data-act="app-install">تثبيت التطبيق</button>` : ''}<button class="btn sm ghost" data-act="app-hint-hide">إخفاء</button></div></div>`;
    }
    return '';
  }

  function homeTeaching(t) {
    const last = t.trend[t.trend.length - 1];
    return html`
      ${periodCard(t.period, t.halaqat)}
      <div class="stats section">
        ${stat(is(ROLE.TEACHER) ? 'طلابي' : isAmir() ? 'طلاب ' + stageName(myStage()) : 'الطلاب الفعّالون', fmtN(t.students), (t.halaqatCount === 1 ? 'في حلقة واحدة' : t.halaqatCount === 2 ? 'في حلقتين' : `في ${fmtN(t.halaqatCount)} حلقات`))}
        ${stat('مجموع الأجزاء المحفوظة', fmtN(t.juzTotal), 'حسب آخر تقرير لكل طالب')}
        ${stat('الخاتمون', fmtN(t.khatim), 'حفظوا 30 جزءاً')}
        ${stat('نسبة الحضور', last && last.attendance != null ? P(last.attendance) : '—', last ? `تقرير ${fMonth(last.month)}` : 'لا توجد تقارير بعد')}
      </div>
      <div class="two-col">
        <section class="section panel">
          <div class="section-head"><h2>متوسط الحفظ للطالب</h2><p>عدد الأجزاء في كل تقرير شهري</p></div>
          ${t.trend.length ? colChart(t.trend.map(m => ({ value: m.avgJuz, label: dMonthShort.format(toDate(m.month + '-01')),
            tip: `${fMonth(m.month)}: متوسط ${fmtN(m.avgJuz)} ${juzWord(m.avgJuz)} للطالب${m.attendance != null ? '، الحضور ' + P(m.attendance) : ''}` })),
            { label: 'متوسط أجزاء الحفظ للطالب في كل شهر' }) : html`<p class="muted">تظهر هنا بعد أول تقرير شهري.</p>`}
        </section>
        <section class="section panel">
          <div class="section-head"><h2>الأكثر حفظاً</h2><p>${t.lastMonth ? `في تقرير ${fMonth(t.lastMonth)}` : ''}</p></div>
          ${t.top.length ? html`<div class="list">${t.top.map((s, i) => html`
            <a href="#" class="row" data-go="student" data-params="${params({ id: s.id })}">
              <span class="rank ${i === 0 ? 'first' : ''}">${i + 1}</span>
              <span class="row-main"><span class="row-title">${s.name}</span><span class="row-meta"> ${fmtN(s.juz)} ${juzWord(s.juz)}</span></span>
              ${chip(ayat(s.ayat), 'green')}</a>`)}</div>`
            : html`<p class="muted">يظهر هنا بعد أول تقرير شهري.</p>`}
        </section>
      </div>
      <section class="section">
        <div class="section-head"><h2>يحتاجون متابعة</h2><p>${t.lastMonth ? `غابوا 4 أيام أو أكثر في تقرير ${fMonth(t.lastMonth)}` : ''}</p></div>
        ${t.attention.length ? html`<div class="list">${t.attention.map(s => html`
          <a href="#" class="row" data-go="student" data-params="${params({ id: s.id })}">
            <span class="row-main"><span class="row-title">${s.name}</span><span class="row-meta"> ${s.halaqaName}</span></span>
            ${chip(`غياب ${s.absentDays} أيام`, 'bad')}</a>`)}</div>`
          : html`<div class="list"><div class="empty small">لا يوجد غياب متكرر في آخر تقرير، والحمد لله.</div></div>`}
      </section>`;
  }

  function periodText(pd) {
    if (!pd) return is(ROLE.ADMIN) ? 'لا توجد فترة إدخال للتقارير. افتح فترة ليتمكن المحفّظون من تعبئة تقرير الشهر.' : 'لا توجد فترة إدخال مفتوحة حالياً.';
    if (pd.status === 'مفتوحة') return `إدخال تقرير شهر ${fMonth(pd.month)} مفتوح حتى ${fDate(pd.endDate)}.`;
    if (pd.status === 'قادمة') return `إدخال تقرير شهر ${fMonth(pd.month)} يبدأ في ${fDate(pd.startDate)}.`;
    return `فترة إدخال تقرير شهر ${fMonth(pd.month)} انتهت بتاريخ ${fDate(pd.endDate)}.`;
  }

  function periodChip(pd) {
    if (!pd) return '';
    if (pd.status === 'مفتوحة') return chip(pd.daysLeft === 1 ? 'آخر يوم' : `تبقّى ${pd.daysLeft} ${pd.daysLeft <= 10 ? 'أيام' : 'يوماً'}`, 'gold');
    return chip(pd.status, pd.status === 'قادمة' ? 'green' : '');
  }

  // حالة تسليم تقرير الحلقة
  const subChip = (h, open) => !h.submitted ? chip('لم يُسلَّم بعد', open ? 'warn' : '')
    : h.pending ? chip('محفوظ على الجهاز، بانتظار الإرسال', 'gold') : chip(`✓ سُلّم ${relDay(String(h.submittedAt).slice(0, 10))}`, 'good');

  function periodCard(pd, halaqat) {
    const open = pd && pd.status === 'مفتوحة';
    const done = halaqat.filter(h => h.submitted).length;
    return html`<section class="panel period-card ${open ? 'open' : ''}">
      <div class="section-head">
        <div><h2>التقرير الشهري ${pd ? `لشهر ${fMonth(pd.month)}` : ''}</h2><p class="sub">${periodText(pd)}</p></div>
        <div class="ph-actions">${periodChip(pd)}
          ${is(ROLE.ADMIN) ? html`<button class="btn sm secondary" data-go="reports" data-params="${params(pd ? { month: pd.month } : {})}">كل التقارير</button>` : ''}</div>
      </div>
      ${pd && halaqat.length ? html`
        ${is(ROLE.ADMIN) ? html`<p class="sub" style="margin-bottom:10px">سلّمت ${done} من ${halaqat.length} ${halaqat.length > 2 ? 'حلقات' : 'حلقة'}</p>` : ''}
        <div class="list">${halaqat.map(h => html`
          <div class="row">
            <div class="row-main"><div class="row-title">${h.name}</div><div class="row-meta">${h.teacherName ? 'المحفّظ ' + h.teacherName + '، ' : ''}${nStudents(h.students)}</div></div>
            ${subChip(h, open)}
            <button class="btn sm ${h.submitted || !open || !teaches(h) ? 'secondary' : ''}" data-go="report" data-params="${params({ month: pd.month, halaqaId: h.id })}">
              ${teaches(h) && open ? (h.submitted ? 'تعديل التقرير' : 'تعبئة التقرير') : 'عرض'}</button>
          </div>`)}</div>` : ''}
      ${!pd && is(ROLE.ADMIN) ? html`<button class="btn" data-act="period-new">${icon('plus')}فتح فترة إدخال</button>` : ''}
    </section>`;
  }

  function homeFinance(f, primary) {
    return html`<section class="${primary ? '' : 'section'}">
      ${primary ? '' : html`<div class="section-head"><h2>الصندوق</h2><p>${fMonth(f.month)}</p></div>`}
      <div class="stats">
        ${stat('الرصيد الحالي', money(f.balance), 'إجمالي الإيرادات بعد خصم المصروفات')}
        ${stat('إيرادات الشهر', money(f.monthIn), fMonth(f.month))}
        ${stat('مصروفات الشهر', money(f.monthOut), fMonth(f.month))}
        ${stat('متأخرات الكفالات', money(f.arrearsTotal), `${fmtN(f.arrears.length)} كفالة متأخرة`)}
      </div>
      ${primary ? financeCharts(f) : html`<p style="margin-top:12px"><button class="btn secondary sm" data-go="finance">فتح المالية</button></p>`}
    </section>`;
  }

  /* ═════════ التقارير الشهرية ═════════ */

  async function pageReports(main, p, seq) {
    const d = await load('reports.month', { month: p.month || '' });
    if (stale(seq)) return;
    S.periodsCache = d.periods;
    const months = [...new Set([d.month, ...d.periods.map(x => x.month)])].sort().reverse();
    const pd = d.period;
    const done = d.halaqat.filter(h => h.submitted).length;
    main.innerHTML = html`
      <div class="page-head">
        <div><h1>${is(ROLE.ADMIN) ? 'التقارير الشهرية' : 'التقرير الشهري'}</h1>
          <p class="sub">${is(ROLE.ADMIN) ? 'افتح فترة إدخال لكل شهر، وتابع الحلقات التي سلّمت تقاريرها' : 'تقرير حلقتك لكل شهر'}</p></div>
        <div class="ph-actions">
          <button class="btn secondary" data-act="export-month" data-month="${d.month}">${icon('download')}تصدير إلى إكسل</button>
          ${is(ROLE.ADMIN) ? html`<button class="btn" data-act="period-new">${icon('plus')}فتح فترة إدخال</button>` : ''}</div>
      </div>
      <div class="toolbar">
        <label class="field"><span>الشهر</span><select data-change="rep-month">${months.map(m => option(m, fMonth(m), d.month))}</select></label>
      </div>
      <div class="notice period-notice">
        <div><strong>${pd ? `فترة الإدخال: من ${fDate(pd.startDate)} حتى ${fDate(pd.endDate)}` : 'لا توجد فترة إدخال لهذا الشهر'}</strong>
          <p>${pd ? periodText(pd) : is(ROLE.ADMIN) ? 'افتح فترة ليتمكن المحفّظون من تعبئة تقرير هذا الشهر.' : 'يمكن تعبئة التقرير بعد أن يفتح المدير فترة الإدخال.'}</p></div>
        <div class="ph-actions">${periodChip(pd)}
          ${is(ROLE.ADMIN) && pd ? html`<button class="btn sm secondary" data-act="period-edit" data-month="${pd.month}">${icon('edit')}تعديل الفترة</button>
            <button class="btn sm ghost danger-text" data-act="period-del" data-month="${pd.month}">${icon('trash')}حذف الفترة</button>` : ''}
          ${is(ROLE.ADMIN) && !pd ? html`<button class="btn sm" data-act="period-new" data-month="${d.month}">فتح فترة لهذا الشهر</button>` : ''}</div>
      </div>
      ${d.halaqat.length ? html`
        ${is(ROLE.ADMIN) ? html`<p class="sub" style="margin-bottom:10px">سلّمت ${done} من ${d.halaqat.length} ${d.halaqat.length > 2 ? 'حلقات' : 'حلقة'}</p>` : ''}
        <div class="table-wrap"><table>
          <thead><tr><th class="idx">#</th><th>الحلقة</th><th>المحفّظ</th><th class="num">الطلاب</th><th>التقرير</th><th class="num">مجموع الآيات</th><th class="num">الحضور</th><th></th></tr></thead>
          <tbody>${paged('reportsMonth', d.halaqat).rows.map((h, i) => html`<tr><td class="idx">${rowNo('reportsMonth', i)}</td>
            <td><strong>${h.name}</strong></td><td>${h.teacherName || '—'}</td><td class="num">${fmtN(h.students)}</td>
            <td>${subChip(h, pd && pd.status === 'مفتوحة')}</td>
            <td class="num">${h.submitted ? fmtN(h.ayatSum) : '—'}</td><td class="num">${h.attendance == null ? '—' : P(h.attendance)}</td>
            <td class="actions"><button class="btn sm secondary" data-go="report" data-params="${params({ month: d.month, halaqaId: h.id })}">
              ${teaches(h) && pd && pd.status === 'مفتوحة' ? (h.submitted ? 'تعديل' : 'تعبئة التقرير') : 'عرض'}</button></td>
          </tr>`)}</tbody>
        </table></div>${paged('reportsMonth', d.halaqat).bar}` : emptyBox('لا توجد حلقات فعّالة.')}`;
  }

  function periodForm(pd) {
    const m = (pd && pd.month) || S.today.slice(0, 7);
    const next = ym => { const d = toDate(ym + '-01'); d.setMonth(d.getMonth() + 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
    openModal({
      title: pd && pd.id ? `تعديل فترة تقرير ${fMonth(pd.month)}` : 'فتح فترة إدخال للتقرير الشهري',
      cls: 'narrow',
      submitLabel: pd && pd.id ? 'حفظ الفترة' : 'فتح الفترة',
      body: html`
        <label class="field"><span>تقرير شهر</span><input type="month" name="month" required value="${m}" ${pd && pd.id ? raw('readonly') : ''}></label>
        <div class="grid2">
          <label class="field"><span>بداية الإدخال</span><input type="date" name="startDate" required value="${(pd && pd.startDate) || m + '-25'}"></label>
          <label class="field"><span>نهاية الإدخال</span><input type="date" name="endDate" required value="${(pd && pd.endDate) || next(m) + '-05'}"></label>
        </div>
        <p class="hint">يستطيع المحفّظون تعبئة تقارير حلقاتهم وتعديلها بين هذين التاريخين فقط، ويستطيع المدير التعديل في أي وقت.</p>
        <label class="field"><span>ملاحظات (اختياري)</span><input name="notes" value="${(pd && pd.notes) || ''}"></label>`,
      onSubmit: async data => {
        if (data.endDate < data.startDate) throw new Error('نهاية الفترة قبل بدايتها');
        const dup = (S.periodsCache || []).find(x => x.month === data.month && !same(x.id, pd && pd.id));
        if (dup) throw new Error(`توجد فترة لشهر ${fMonth(data.month)} مسبقاً. عدّلها بدلاً من إنشاء فترة جديدة.`);
        const id = (pd && pd.id) || tempId('p');
        mutate('periods.save', Object.assign({}, data, pd && pd.id ? { id } : {}), { tempId: pd && pd.id ? '' : id, label: `فترة إدخال تقرير ${fMonth(data.month)}` });
        localPeriod(Object.assign({}, data, { id }));
        toast(savedMsg(`حُفظت فترة تقرير ${fMonth(data.month)}`));
        go('reports', { month: data.month }, S.route === 'reports' ? 'replace' : 'push');
      },
    });
  }

  async function pageReport(main, p, seq) {
    const d = await load('report.get', { month: p.month, halaqaId: p.halaqaId });
    if (stale(seq)) return;
    renderReport(main, d);
  }

  function renderReport(main, d) {
    const ro = !d.editable, pd = d.period;
    S.reportCache = d;
    let note;
    if (d.submission && d.submission.pending) note = online ? 'حُفظ التقرير، وجارٍ إرساله إلى الشيت.' : 'حُفظ التقرير على هذا الجهاز، وسيُرسل إلى الشيت تلقائياً عند عودة الإنترنت.';
    else if (d.submission) note = `سُلّم التقرير ${relDay(d.submission.at.slice(0, 10))} الساعة ${iso(d.submission.at.slice(11, 16))}${d.submission.byUser ? '، بواسطة ' + d.submission.byUser : ''}.`;
    else note = 'لم يُسلَّم هذا التقرير بعد.';
    if (!ro && !is(ROLE.ADMIN) && pd) note += ` يمكنك التعديل حتى ${fDate(pd.endDate)}.`;
    if (ro) {
      note += isAmir() && !teaches(d.halaqa) ? ` التقرير للاطلاع فقط، ويعرض طلاب ${stageName(myStage())}.`
        : !pd ? ' لا توجد فترة إدخال لهذا الشهر.' : pd.status === 'قادمة' ? ` تبدأ فترة الإدخال في ${fDate(pd.startDate)}.` : ' انتهت فترة الإدخال، والتقرير للاطلاع فقط.';
    }
    main.innerHTML = html`
      <div class="page-head">
        <div class="ph-title">
          <button class="icon-btn no-print" data-go="${is(ROLE.ADMIN) ? 'reports' : 'home'}" data-params="${is(ROLE.ADMIN) ? params({ month: d.month }) : ''}" aria-label="رجوع">${icon('back')}</button>
          <div><h1>تقرير ${d.halaqa.name}</h1><p class="sub">شهر ${fMonth(d.month)}${d.halaqa.teacherName ? '، المحفّظ ' + d.halaqa.teacherName : ''}، ${nStudents(d.entries.length)}</p></div>
        </div>
        <div class="ph-actions no-print">
          ${d.entries.length ? html`<button class="btn secondary" data-act="export-report">${icon('download')}تصدير إلى إكسل</button>` : ''}
          <button class="btn secondary" data-act="print-report">${icon('print')}طباعة</button></div>
      </div>
      <div class="notice ${d.submission ? 'ok' : ''} no-print">${note}</div>
      ${d.entries.length ? html`
      <form data-form="report" class="rep">
        <input type="hidden" name="month" value="${d.month}"><input type="hidden" name="halaqaId" value="${d.halaqa.id}">
        ${d.entries.map((e, i) => repCard(e, i, ro))}
        ${ro ? '' : html`<div class="savebar no-print"><span id="repLeft"></span><button class="btn" type="submit">${d.submission ? 'حفظ التعديلات' : 'حفظ وتسليم التقرير'}</button></div>`}
      </form>` : emptyBox('لا يوجد طلاب فعّالون في هذه الحلقة.')}`;
    $$('.rep-card').forEach(updateRepCalc);
    updateRepLeft();
  }

  function surahPick(name, sel, label) {
    return html`<select name="${name}" class="surah-sel" aria-label="${label}"><option value="">السورة</option>
      ${Q.surahs.map((x, i) => option(i + 1, `${i + 1}. ${x[0]}`, sel))}</select>`;
  }

  function ayahOptions(surah, sel) {
    const n = surahLen(Number(surah));
    let out = '<option value="">الآية</option>';
    for (let a = 1; a <= n; a++) out += `<option value="${a}"${a === Number(sel) ? ' selected' : ''}>${a}</option>`;
    return raw(out);
  }

  function repCard(e, i, ro) {
    const b = e.before || {};
    const beforeText = [b.lastAchievement && 'وصل إلى ' + b.lastAchievement, b.juzCount !== '' && b.juzCount != null && `${fmtN(b.juzCount)} ${juzWord(b.juzCount)}`].filter(Boolean).join('، ');
    return html`<fieldset class="rep-card" data-sid="${e.studentId}" ${ro ? raw('disabled') : ''}>
      <legend><span class="rep-num">${i + 1}</span><span class="rep-name">${e.studentName}</span>${beforeText ? html`<span class="rep-before">${beforeText}</span>` : ''}</legend>
      <div class="rep-sec">
        <span class="rep-label">الحفظ هذا الشهر</span>
        <div class="rep-range">
          <div class="rep-point"><span>من</span>${surahPick('fromSurah', e.fromSurah, 'من سورة')}
            <select name="fromAyah" class="ayah-sel" aria-label="من آية">${ayahOptions(e.fromSurah, e.fromAyah)}</select></div>
          <div class="rep-point"><span>إلى</span>${surahPick('toSurah', e.toSurah, 'إلى سورة')}
            <select name="toAyah" class="ayah-sel" aria-label="إلى آية">${ayahOptions(e.toSurah, e.toAyah)}</select></div>
        </div>
        <p class="rep-calc"></p>
      </div>

  // عدد الآيات وكم جزء، تحت اختيار البداية والنهاية
  function updateRepCalc(card) {
    const v = n => Number($(`[name=${n}]`, card).value);
    const el = $('.rep-calc', card);
    const [fs_, fa, ts, ta] = [v('fromSurah'), v('fromAyah'), v('toSurah'), v('toAyah')];
    if (fs_ && fa && ts && ta) {
      const r = rangeInfo(fs_, fa, ts, ta);
      const juz = Math.round(r.juz * 10) / 10;
      el.textContent = `${rangeText({ fromSurah: fs_, fromAyah: fa, toSurah: ts, toAyah: ta })}: ${ayat(r.ayat)}${juz >= 0.1 ? `، تقريباً ${fmtN(juz)} ${juzWord(juz)}` : ''}`;
      el.className = 'rep-calc ok';
    } else if (fs_ || ts) {
      el.textContent = 'اختر السورة والآية للبداية والنهاية';
      el.className = 'rep-calc';
    } else {
      el.textContent = 'لم يحفظ جديداً هذا الشهر';
      el.className = 'rep-calc muted';
    }
  }

  function onRepChange(t) {
    const card = t.closest('.rep-card');
    if (!card) return;
    if (t.classList.contains('surah-sel')) {
      const ayah = $(`[name=${t.name === 'fromSurah' ? 'fromAyah' : 'toAyah'}]`, card);
      const keep = Number(ayah.value);
      const len = surahLen(Number(t.value));
      // للنهاية بنختار آخر آية بالسورة (غالباً خلّصها)، وللبداية أول آية
      const pickAyah = !t.value ? '' : keep && keep <= len ? keep : t.name === 'toSurah' ? len : 1;
      ayah.innerHTML = ayahOptions(t.value, pickAyah);
    }
    updateRepCalc(card);
  }

  function updateRepLeft() {
    const el = $('#repLeft');
    if (!el) return;
    const cards = $$('.rep-card');
    const left = cards.filter(c => $('[name=presentDays]', c).value === '' || !$('[name=grade]', c).value).length;
    el.textContent = left ? `${nStudents(left)} لم يُستكمل لهم الحضور أو التقدير` : `اكتملت بيانات جميع الطلاب (${cards.length})`;
  }

  // التقرير بينحفظ على الجهاز فوراً (حتى بدون إنترنت) وبينبعت للشيت بالخلفية
  function submitReport(form) {
    const entries = $$('.rep-card', form).map(c => {
      const o = { studentId: Number(c.dataset.sid) || c.dataset.sid, sardMonth: $$('[name=sard]:checked', c).map(x => Number(x.value)) };
      $$('select, input:not([type=checkbox])', c).forEach(el => { o[el.name] = el.value; });
      return o;
    });
    const month = form.month.value, halaqaId = form.halaqaId.value;
    const d = readOf('report.get', { month, halaqaId });
    mutate('report.save', { month, halaqaId, entries }, { label: `تقرير ${d ? d.halaqa.name : halaqaName(halaqaId)} لشهر ${fMonth(month)}` });
    form.classList.remove('dirty');
    const nd = localReport(month, halaqaId, entries);
    toast(savedMsg('حُفظ التقرير'));
    if (nd) renderReport($('#main'), nd);
    window.scrollTo(0, 0);
  }

  // التقرير المحفوظ على الجهاز بيظهر فوراً بكل الصفحات لحتى ينبعت
  function localReport(month, halaqaId, entries) {
    const at = nowStamp(), num = v => (v === '' || v == null ? '' : Number(v));
    const by = {};
    entries.forEach(e => { by[e.studentId] = e; });
    let out = null;
    patchReads('report.get', d => {
      if (d.month !== month || !same(d.halaqa.id, halaqaId)) return;
      d.entries.forEach(e => {
        const n = by[e.studentId];
        if (!n) return;
        Object.assign(e, {
          fromSurah: num(n.fromSurah), fromAyah: num(n.fromAyah), toSurah: num(n.toSurah), toAyah: num(n.toAyah),
          sardMonth: n.sardMonth, presentDays: num(n.presentDays), absentDays: num(n.absentDays), grade: n.grade, notes: n.notes,
        });
      });
      d.submission = { byUser: S.user.name, at, pending: true };
      out = d;
    });
    let ayatSum = 0, pr = 0, ab = 0;
    entries.forEach(e => {
      if (e.fromSurah && e.fromAyah && e.toSurah && e.toAyah) ayatSum += rangeInfo(+e.fromSurah, +e.fromAyah, +e.toSurah, +e.toAyah).ayat;
      pr += Number(e.presentDays) || 0; ab += Number(e.absentDays) || 0;
    });
    const mark = h => { if (same(h.id, halaqaId)) Object.assign(h, { submitted: true, submittedAt: at, pending: true }); };
    patchReads('reports.month', d => {
      if (d.month !== month) return;
      d.halaqat.forEach(h => {
        if (!same(h.id, halaqaId)) return;
        mark(h);
        Object.assign(h, { ayatSum, attendance: pr + ab ? Math.round((pr / (pr + ab)) * 100) : null });
      });
    });
    patchReads('dashboard', d => { if (d.teaching && d.teaching.period && d.teaching.period.month === month) d.teaching.halaqat.forEach(mark); });
    patchReads('halaqat.get', d => { if (same(d.halaqa.id, halaqaId) && d.period && d.period.month === month) d.submitted = at; });
    return out;
  }

  function bulkForm() {
    const ids = [...S.selected], keep = '__keep';
    openModal({
      title: `تعديل ${nStudents(ids.length)}`,
      cls: 'narrow',
      submitLabel: 'تطبيق على المحدّدين',
      body: html`
        <p class="hint">اختر ما تريد تغييره فقط، وتبقى باقي البيانات كما هي لكل طالب.</p>
        <label class="field"><span>الحلقة والمحفّظ</span><select name="halaqaId">
          <option value="${keep}">بدون تغيير</option><option value="">بدون حلقة</option>
          ${S.halaqat.map(h => option(h.id, h.name + (h.teacherName ? '، المحفّظ ' + h.teacherName : ''), keep))}</select></label>
        <label class="field"><span>المرحلة</span><select name="stage"><option value="${keep}">بدون تغيير</option><option value="">دون مرحلة</option>${options(S.lists.stages, keep)}</select></label>
        <label class="field"><span>الحالة</span><select name="status"><option value="${keep}">بدون تغيير</option>${options(S.lists.studentStatus, keep)}</select></label>`,
      onSubmit: async data => {
        const payload = { ids: ids.map(idOf) };
        ['halaqaId', 'stage', 'status'].forEach(k => { if (data[k] !== keep) payload[k] = data[k]; });
        if (Object.keys(payload).length === 1) throw new Error('اختر ما تريد تغييره');
        mutate('students.bulk', payload, { label: `تعديل جماعي لـ${nStudents(ids.length)}` });
        const h = payload.halaqaId ? S.halaqat.find(x => same(x.id, payload.halaqaId)) : null;
        ids.forEach(id => {
          const s = S.students.find(x => same(x.id, id));
          if (!s) return;
          const ch = {};
          if ('halaqaId' in payload) ch.halaqaId = payload.halaqaId;
          if ('stage' in payload) ch.stage = payload.stage;
          else if (h && h.stage && !s.stage) ch.stage = h.stage;
          if ('status' in payload) ch.status = payload.status;
          localStudent(id, Object.assign({}, s, ch), true);
        });
        commitLocal();
        S.selected.clear();
        toast(savedMsg(`عُدّلت بيانات ${nStudents(ids.length)}`));
        refreshView();
      },
    });
  }

  };

  function reportText(d) {
    const s = d.student, r = d.reports[0];
    const lines = [
      'السلام عليكم ورحمة الله وبركاته',
      `تقرير الطالب ${s.name} لشهر ${fMonth(r.month)}، ${S.settings.orgName}:`,
    ];
    if (r.fromSurah) lines.push(`• الحفظ هذا الشهر: من سورة ${surahName(r.fromSurah)} آية ${r.fromAyah} إلى سورة ${surahName(r.toSurah)} آية ${r.toAyah} (${ayat(r.ayatCount)})`);
    if (r.juzCount !== '') lines.push(`• مجموع المحفوظ: ${fmtN(r.juzCount)} ${juzWord(r.juzCount)}`);
    if (r.sardMonth.length) lines.push(`• السرد هذا الشهر: جزء ${r.sardMonth.join('، ')}`);
    if (r.sardJuz !== '') lines.push(`• مجموع أجزاء السرد: ${fmtN(r.sardJuz)}${r.sardDetails ? ` (${r.sardDetails})` : ''}`);

    if (r.notes) lines.push(`• ملحوظات: ${r.notes}`);
    lines.push('جزاكم الله خيراً');
    return lines.join('\n');
  }

  /* ═════════ استيراد كشف الطلاب ═════════ */

  const toLatin = v => String(v == null ? '' : v)
    .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x0660).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x06F0).trim();

  function parseDmy(s) {
    s = toLatin(s);
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
    if (!m || +m[2] > 12 || +m[1] > 31) return '';
    return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  }

  // بيقرأ الجدول المنسوخ من إكسل (الأعمدة مفصولة بـ Tab) وبيعرف الأعمدة من عناوينها
  function readPasted(text, headerRe, label) {
    const lines = String(text || '').replace(/\r/g, '').split('\n').filter(l => l.trim()).map(l => l.split('\t').map(c => c.trim()));
    if (!lines.length) throw new Error('الصق الكشف أولاً');
    const hIdx = lines.findIndex(r => r.some(c => headerRe.test(c)));
    if (hIdx < 0) throw new Error(`لم يُعثر على صف العناوين. يجب أن يحتوي على عمود «${label}».`);
    if (lines[hIdx].length < 2) throw new Error('الأعمدة غير مفصولة. انسخ الجدول مباشرة من إكسل أو جوجل شيت.');
    return { lines, hIdx, H: lines[hIdx] };
  }

  function parseRoster(text) {
    const { lines, hIdx } = readPasted(text, /اسم الطالب/, 'اسم الطالب');
    let titleTeacher = '';
    lines.slice(0, hIdx).forEach(r => {
      const m = r.filter(Boolean).join(' ').match(/(?:المحفظ|المحفّظ|المعلم)[^/]*\/\s*(.+)/);
      if (m) titleTeacher = m[1].split(/عدد/)[0].replace(/\s+/g, ' ').trim();
    });
    const H = lines[hIdx];
    const find = re => H.findIndex(h => re.test(h));
    const C = {
      name: find(/اسم الطالب/), nationalId: find(/هوية الطالب/), birthDate: find(/الميلاد/), phone: find(/جوال|هاتف|موبايل/),
      stage: find(/المرحلة/), guardianId: find(/هوية ولي/), guardianName: find(/^(اسم )?ولي الأمر$/), relation: find(/القرابة/),
      teacherName: find(/اسم (المعلم|المحفظ|المحفّظ)/), teacherId: find(/هوية (المعلم|المحفظ|المحفّظ)/),
      juzCount: find(/أجزاء الحفظ/), last: find(/آخر إنجاز/), sardJuz: find(/أجزاء السرد/), sardDetails: find(/تفصيل/),
      area: find(/المحلية|المنطقة|الحي/), notes: find(/ملحوظات|ملاحظات/),
    };
    // بعض العناوين مدموجة على عمودين (والتاني عنوانه فاضي)
    const cell = (r, i, span) => {
      if (i < 0) return '';
      let v = r[i] || '';
      if (span && H[i + 1] === '' && r[i + 1]) v = (v + ' ' + r[i + 1]).trim();
      return v.replace(/\s+/g, ' ');
    };
    const digits = v => toLatin(v).replace(/\D/g, '');
    const rows = [], seen = {};
    let badPhones = 0, fixedPhones = 0, badDates = 0, dups = 0;
    lines.slice(hIdx + 1).forEach(r => {
      const name = cell(r, C.name);
      if (!name || /اسم الطالب/.test(name)) return;
      const nationalId = digits(cell(r, C.nationalId)), guardianId = digits(cell(r, C.guardianId));
      let phone = digits(cell(r, C.phone));
      if (phone && (phone === guardianId || phone === nationalId)) { phone = ''; badPhones++; }
      else if (/^5\d{8}$/.test(phone)) { phone = '0' + phone; fixedPhones++; }
      const rawBirth = cell(r, C.birthDate), birthDate = parseDmy(rawBirth);
      if (rawBirth && !birthDate) badDates++;
      if (nationalId && seen[nationalId]) { dups++; return; }
      seen[nationalId || name] = true;
      rows.push({
        name, nationalId, birthDate, guardianPhone: phone, guardianId,
        stage: (S.lists.stages || []).find(x => x.replace(/^إ/, 'ا') === cell(r, C.stage).replace(/^[إا]/, 'ا')) || '',
        guardianName: cell(r, C.guardianName), guardianRelation: cell(r, C.relation),
        teacherName: cell(r, C.teacherName, true) || titleTeacher, teacherNationalId: digits(cell(r, C.teacherId)),
        juzCount: toLatin(cell(r, C.juzCount)), lastAchievement: cell(r, C.last, true),
        sardJuz: toLatin(cell(r, C.sardJuz)), sardDetails: cell(r, C.sardDetails, true),
        area: cell(r, C.area), notes: cell(r, C.notes),
      });
    });
    if (!rows.length) throw new Error('لم يُعثر على طلاب تحت صف العناوين');
    const warnings = [];
    if (badPhones) warnings.push(`${badPhones} من أرقام الجوال مكتوب مكانها رقم هوية، ولن تُحفظ. يمكنك تصحيحها لاحقاً من ملف الطالب.`);
    if (fixedPhones) warnings.push(`${fixedPhones} من أرقام الجوال كان ينقصها الصفر في أولها، وأُضيف.`);
    if (badDates) warnings.push(`${badDates} من تواريخ الميلاد غير واضحة، ولن تُحفظ.`);
    if (dups) warnings.push(`${dups} من الطلاب مكرّرون برقم الهوية نفسه داخل الكشف، واحتُسب كلٌّ منهم مرة واحدة.`);
    return { rows, warnings };
  }

  // الاستيراد: مع الإنترنت بيتم فوراً وبتطلع نتيجته، وبدونه بينحفظ الكشف على الجهاز وبيُستورد لاحقاً
  async function importNow(action, payload, label) {
    if (online && !outbox.length) {
      try {
        const r = await call(action, payload);
        reads.forEach(x => { x.t = 0; });
        await refreshFromServer();
        refreshView();
        return r;
      } catch (e) {
        if (!e.offline) throw e;
      }
    }
    mutate(action, payload, { label });
    toast('حُفظ الكشف على هذا الجهاز، وسيُستورد تلقائياً عند عودة الإنترنت');
    return null;
  }

  function halaqaForm(h = {}) {
    openModal({
      title: h.id ? 'تعديل الحلقة' : 'إضافة حلقة',
      body: html`
        <label class="field"><span>اسم الحلقة</span><input name="name" required value="${h.name || ''}"></label>
        <label class="field"><span>المحفّظ</span><select name="teacherId"><option value="">بدون محفّظ</option>${S.teachers.map(t => option(t.id, t.name, h.teacherId))}</select></label>
        <label class="field"><span>المرحلة</span><select name="stage"><option value="">عدة مراحل</option>${options(S.lists.stages, h.stage)}</select>
          <span class="hint">الطالب الذي يُضاف إلى الحلقة دون مرحلة يأخذ مرحلتها، ويرى أمير المرحلة هذه الحلقة.</span></label>
        <label class="field"><span>الوقت</span><input name="time" placeholder="مثلاً: بعد العصر" value="${h.time || ''}"></label>
        <label class="check"><input type="checkbox" name="active" data-bool ${h.active !== false ? raw('checked') : ''}>الحلقة فعّالة</label>
        <label class="field"><span>ملاحظات</span><textarea name="notes">${h.notes || ''}</textarea></label>`,
      onSubmit: async data => {
        const id = h.id || tempId('h');
        mutate('halaqat.save', Object.assign({}, data, h.id ? { id } : {}), { tempId: h.id ? '' : id, label: (h.id ? 'تعديل ' : 'إضافة ') + data.name });
        const t = S.teachers.find(x => same(x.id, data.teacherId));
        const rec = Object.assign({}, h, {
          id, name: String(data.name).trim(), teacherId: t ? t.id : '', teacherName: t ? t.name : '', days: '',
          time: String(data.time || '').trim(), place: '', active: data.active !== false, notes: String(data.notes || '').trim(), stage: data.stage || '',
        });
        upsert(S.halaqat, rec);
        patchReads('halaqat.get', d => {
          if (!same(d.halaqa.id, id)) return;
          Object.assign(d.halaqa, rec);
          d.teacher = t ? { id: t.id, name: t.name, phone: d.teacher && same(d.teacher.id, t.id) ? d.teacher.phone : '' } : null;
        });
        patchReads('reports.month', d => d.halaqat.forEach(x => { if (same(x.id, id)) Object.assign(x, rec); }));
        commitLocal();
        toast(savedMsg(h.id ? 'حُفظت الحلقة' : 'أُضيفت الحلقة'));
        refreshView();
      },
    });
  }

          </td></tr>`)}</tbody></table></div>${paged('sponsors', sp).bar}` : emptyBox('لا يوجد كفلاء أو متبرعون بعد.')}`;
  }

  function financeCharts(f) {
    const ins = f.categories.filter(c => c.kind === 'in'), outs = f.categories.filter(c => c.kind === 'out');
    const catList = (list, cls) => {
      const max = Math.max(1, ...list.map(c => c.amount));
      return list.length ? list.map(c => html`<div class="cat-row"><span>${c.name}</span>
        <div class="meter-track ${cls}"><i style="width:${(c.amount / max) * 100}%"></i></div><span class="num">${money(c.amount)}</span></div>`)
        : html`<p class="muted" style="font-size:14px">لا توجد بيانات لهذا الشهر.</p>`;
    };
    return html`
      <div class="two-col">
        <section class="panel section">
          <div class="section-head"><h2>الإيرادات والمصروفات</h2><p>آخر 6 أشهر</p></div>
          <div class="legend"><span><i style="background:var(--green)"></i>إيرادات</span><span><i style="background:var(--gold)"></i>مصروفات</span></div>
          ${colChart(f.months.map(m => ({ income: m.income, expense: m.expense, label: dMonthShort.format(toDate(m.month + '-01')),
            tip: `${fMonth(m.month)}: إيرادات ${money(m.income)}، مصروفات ${money(m.expense)}` })),
            { series: [{ key: 'income', cls: '' }, { key: 'expense', cls: 'gold' }], label: 'الإيرادات والمصروفات لآخر ستة أشهر' })}
        </section>
        <section class="panel section">
          <div class="section-head"><h2>كفالات متأخرة</h2><p>${money(f.arrearsTotal)}</p></div>
          ${f.arrears.length ? html`<div class="list">${f.arrears.map(k => html`
            <div class="row"><div class="row-main"><div class="row-title">${k.sponsorName}</div>
              <div class="row-meta">${k.kind === 'عامة' ? 'كفالة عامة' : k.kind + ': ' + k.beneficiaryName}، ${money(k.monthly)} شهرياً</div></div>
              ${chip(money(k.arrears), 'bad')}</div>`)}</div>` : html`<p class="muted">كل الكفالات منتظمة.</p>`}
        </section>
      </div>
      <div class="two-col">
        <section class="panel section"><div class="section-head"><h2>الإيرادات حسب البند</h2><p>${fMonth(f.month)}</p></div>${catList(ins, '')}</section>
        <section class="panel section"><div class="section-head"><h2>المصروفات حسب البند</h2><p>${fMonth(f.month)}</p></div>${catList(outs, 'gold')}</section>
      </div>`;
  }

  async function txForm(tx = {}, preset = {}) {
    const [sponsors, kafalat] = await Promise.all([load('sponsors.list'), load('kafalat.list')]);
    const t = Object.assign({ type: 'تبرع', date: S.today, method: 'نقدي', beneficiaryKind: 'طالب' }, preset, tx);
    const kafOpts = kafalat.filter(k => k.active || same(k.id, t.kafalaId));
    const reward = t.type === 'مكافأة';
    const form = openModal({
      title: tx.id ? (reward ? 'تعديل المكافأة' : 'تعديل حركة مالية') : reward ? 'صرف مكافأة' : 'إضافة حركة مالية',
      submitLabel: reward && !tx.id ? 'صرف المكافأة' : 'حفظ',
      body: html`
        <div class="field"><span>النوع</span>${seg('type', S.lists.txTypes, t.type)}</div>
        <div class="grid2">
          <label class="field"><span>المبلغ${S.settings.currency ? ' (' + S.settings.currency + ')' : ''}</span><input name="amount" inputmode="decimal" required value="${t.amount || ''}"></label>
          <label class="field"><span>التاريخ</span><input type="date" name="date" value="${t.date}"></label>
        </div>
        <label class="field" data-show="دفعة كفالة"><span>الكفالة</span>
          ${kafOpts.length ? html`<select name="kafalaId">${kafOpts.map(k => option(k.id, `${k.sponsorName}: ${k.kind === 'عامة' ? 'عامة' : k.beneficiaryName} (${money(k.monthly)} شهرياً)`, t.kafalaId))}</select>`
            : html`<p class="hint">لا توجد كفالات فعّالة. أضف كفالة من تبويب الكفالات أولاً.</p>`}</label>
        <label class="field" data-show="تبرع"><span>المتبرع</span><select name="sponsorId"><option value="">فاعل خير</option>${sponsors.map(s => option(s.id, s.name, t.sponsorId))}</select></label>
        <div class="field" data-show="مكافأة"><span>المكافأة لـ</span>${seg('beneficiaryKind', S.lists.rewardKinds.map(kindWord), kindWord(t.beneficiaryKind))}</div>
        <label class="field" data-show="مكافأة"><span>المستفيد</span><select name="beneficiaryId" data-selected="${t.beneficiaryId || ''}"></select></label>
        <label class="field" data-show="تبرع مصروف مكافأة"><span id="catLabel">البند</span><input name="category" list="catList" value="${t.category || ''}" placeholder="اختر أو اكتب">
          <datalist id="catList"></datalist></label>
        <div class="grid2">
          <label class="field"><span>طريقة الدفع</span><select name="method">${options(S.lists.methods, t.method)}</select></label>
          <label class="field"><span>رقم الإيصال</span><input name="receipt" value="${t.receipt || ''}"></label>
        </div>
        <label class="field"><span>ملاحظات</span><textarea name="notes">${t.notes || ''}</textarea></label>`,
      onSubmit: async data => {
        const amount = Number(toLatin(data.amount));
        if (!(amount > 0)) throw new Error('أدخل مبلغاً أكبر من صفر');
        if (data.type === 'دفعة كفالة' && !data.kafalaId) throw new Error('اختر الكفالة المدفوعة');
        data.beneficiaryKind = data.beneficiaryKind === 'محفّظ' ? 'محفظ' : 'طالب';
        const ben = data.type === 'مكافأة' ? (data.beneficiaryKind === 'محفظ' ? S.teachers : S.students).find(x => same(x.id, data.beneficiaryId)) : null;
        if (data.type === 'مكافأة' && !ben) throw new Error(`اختر ${data.beneficiaryKind === 'محفظ' ? 'المحفّظ' : 'الطالب'} المستفيد من المكافأة`);
        if (ben) data.beneficiaryId = ben.id;
        const id = tx.id || tempId('t');
        mutate('transactions.save', Object.assign({}, data, tx.id ? { id } : {}), {
          tempId: tx.id ? '' : id, label: ben ? `مكافأة ${money(amount)} لـ ${ben.name}` : `${data.type} بمبلغ ${money(amount)}`,
        });
        localTx(id, data, amount, sponsors, kafalat, tx);
        toast(savedMsg(ben ? `صُرفت مكافأة ${ben.name}` : 'حُفظت الحركة'));
        if (['finance', 'student', 'teacher'].includes(S.route)) refreshView();
      },
    });
    syncTxForm(form);
  }

  function syncTxForm(form) {
    const type = (form.querySelector('input[name=type]:checked') || {}).value;
    $$('[data-show]', form).forEach(el => { el.hidden = !el.dataset.show.split(' ').includes(type); });
    const cats = type === 'مصروف' ? S.lists.expenseCategories : type === 'مكافأة' ? S.lists.rewardCategories : S.lists.incomeCategories;
    $('#catList', form).innerHTML = html`${cats.map(c => html`<option value="${c}">`)}`;
    $('#catLabel', form).textContent = type === 'مكافأة' ? 'نوع المكافأة' : 'البند';
    // قائمة الطلاب أو المحفّظين حسب المستفيد من المكافأة
    const teacher = (form.querySelector('input[name=beneficiaryKind]:checked') || {}).value === 'محفّظ';
    const sel = form.beneficiaryId;
    const cur = sel.value || sel.dataset.selected;
    const src = teacher ? S.teachers : S.students.filter(s => s.status === 'فعّال' || same(s.id, cur));
    sel.innerHTML = html`<option value="">اختر ${teacher ? 'المحفّظ' : 'الطالب'}</option>
      ${src.map(x => option(x.id, x.name + (!teacher && x.halaqaId ? '، ' + halaqaName(x.halaqaId) : ''), cur))}`;
  }

  async function kafalaForm(k = {}) {
    const sponsors = await load('sponsors.list');
    if (!sponsors.length) { toast('أضف الكافل أولاً من تبويب «الكفلاء والمتبرعون»', 'error'); return; }
    const t = Object.assign({ kind: 'طالب', startDate: S.today.slice(0, 8) + '01', active: true }, k);
    const form = openModal({
      title: k.id ? 'تعديل الكفالة' : 'إضافة كفالة',
      body: html`
        <label class="field"><span>الكافل</span><select name="sponsorId" required>${sponsors.map(s => option(s.id, s.name, t.sponsorId))}</select></label>
        <div class="field"><span>نوع الكفالة</span>${seg('kind', S.lists.kafalaKinds, t.kind)}</div>
        <label class="field" id="benField"><span>المستفيد</span><select name="beneficiaryId"></select></label>
        <div class="grid2">
          <label class="field"><span>المبلغ الشهري</span><input name="monthly" inputmode="decimal" required value="${t.monthly || ''}"></label>
          <label class="field"><span>تاريخ البدء</span><input type="date" name="startDate" required value="${t.startDate}"></label>
        </div>
        <label class="field"><span>تاريخ الانتهاء (اختياري)</span><input type="date" name="endDate" value="${t.endDate || ''}"></label>
        <label class="check"><input type="checkbox" name="active" data-bool ${t.active ? raw('checked') : ''}>الكفالة فعّالة</label>
        <label class="field"><span>ملاحظات</span><textarea name="notes">${t.notes || ''}</textarea></label>`,
      onSubmit: async data => {
        const monthly = Number(toLatin(data.monthly));
        if (!(monthly > 0)) throw new Error('أدخل المبلغ الشهري للكفالة');
        if (data.endDate && data.endDate < data.startDate) throw new Error('تاريخ الانتهاء قبل تاريخ البدء');
        const id = k.id || tempId('k');
        const sp = sponsors.find(x => same(x.id, data.sponsorId)) || {};
        mutate('kafalat.save', Object.assign({}, data, k.id ? { id } : {}), { tempId: k.id ? '' : id, label: `كفالة ${sp.name || ''}` });
        const src = data.kind === 'طالب' ? S.students : data.kind === 'محفظ' ? S.teachers : data.kind === 'حلقة' ? S.halaqat : [];
        const ben = data.kind === 'عامة' ? null : src.find(x => same(x.id, data.beneficiaryId));
        const rec = Object.assign({ months: 0, due: 0, paid: 0, arrears: 0 }, k, {
          id, sponsorId: sp.id, sponsorName: sp.name || '', sponsorPhone: sp.phone || k.sponsorPhone || '', kind: data.kind,
          beneficiaryId: ben ? ben.id : '', beneficiaryName: ben ? ben.name : 'عامة', monthly, startDate: data.startDate,
          endDate: data.endDate || '', active: data.active !== false, notes: String(data.notes || '').trim(),
        });
        patchReads('kafalat.list', list => upsert(list, rec));
        commitLocal();
        toast(savedMsg('حُفظت الكفالة'));
        refreshView();
      },
    });
    form.dataset.kafala = '1';
    syncKafalaForm(form, t.beneficiaryId);
  }

  function syncKafalaForm(form, selected) {
    const kind = (form.querySelector('input[name=kind]:checked') || {}).value;
    const field = $('#benField', form), sel = form.beneficiaryId;
    const src = kind === 'طالب' ? S.students.filter(s => s.status === 'فعّال' || same(s.id, selected))
      : kind === 'محفظ' ? S.teachers : kind === 'حلقة' ? S.halaqat : [];
    field.hidden = kind === 'عامة';
    sel.innerHTML = html`${src.map(x => option(x.id, x.name, selected))}`;
  }

  function sponsorForm(s = {}) {
    openModal({
      title: s.id ? 'تعديل بيانات الكافل' : 'إضافة كافل أو متبرع',
      body: html`
        <label class="field"><span>الاسم</span><input name="name" required value="${s.name || ''}"></label>
        <label class="field"><span>الهاتف</span><input name="phone" dir="ltr" inputmode="tel" value="${s.phone || ''}"></label>
        <label class="field"><span>ملاحظات</span><textarea name="notes">${s.notes || ''}</textarea></label>`,
      onSubmit: async data => {
        const id = s.id || tempId('sp');
        mutate('sponsors.save', Object.assign({}, data, s.id ? { id } : {}), { tempId: s.id ? '' : id, label: (s.id ? 'تعديل بيانات ' : 'إضافة ') + data.name });
        const rec = Object.assign({ given: 0, activeKafalat: 0, arrears: 0 }, s, { id, name: String(data.name).trim(), phone: toLatin(data.phone).replace(/[^\d+]/g, ''), notes: String(data.notes || '').trim() });
        patchReads('sponsors.list', list => upsert(list, rec));
        patchReads('kafalat.list', list => list.forEach(k => { if (same(k.sponsorId, id)) Object.assign(k, { sponsorName: rec.name, sponsorPhone: rec.phone }); }));
        commitLocal();
        toast(savedMsg('حُفظت بيانات الكافل'));
        refreshView();
      },
    });
  }

    openModal({
      title: 'إيصال استلام',
      submitLabel: 'طباعة',
      cancelLabel: 'إغلاق',
      keepOpen: true,
      body: html`<div class="receipt">
        <div class="receipt-head">${brandMark(48)}<div><h2>${S.settings.orgName}</h2><p class="sub">إيصال رقم ${t.receipt || (isTemp(t.id) ? 'يُحدَّد بعد الإرسال إلى الشيت' : t.id)}</p></div></div>
        <dl class="info">
          <dt>استلمنا من</dt><dd>${t.sponsorName || 'فاعل خير'}</dd>
          <dt>المبلغ</dt><dd class="receipt-amount">${money(t.amount)}</dd>
          <dt>عن</dt><dd>${t.type}${t.category ? '، ' + t.category : ''}</dd>
          <dt>التاريخ</dt><dd>${fDate(t.date)}</dd>
          <dt>طريقة الدفع</dt><dd>${t.method || '—'}</dd>
          ${t.notes ? html`<dt>ملاحظات</dt><dd>${t.notes}</dd>` : ''}
          <dt>المستلم</dt><dd>${t.byUser || S.user.name}</dd>
        </dl>
        <p class="sub">جزاكم الله خيراً وبارك في مالكم.</p>
      </div>`,
      onSubmit: async (data, form) => { printReceipt(form); },
    });
  }

    openModal({
      title: 'سند صرف مكافأة',
      submitLabel: 'طباعة',
      cancelLabel: 'إغلاق',
      keepOpen: true,
      body: html`<div class="receipt">

          <dt>المبلغ</dt><dd class="receipt-amount">${money(t.amount)}</dd>

          <dt>التاريخ</dt><dd>${fDate(t.date)}</dd>

        <p class="sub">توقيع المستلم: ...................................</p>

  /* ═════════ المستخدمون والإعدادات ═════════ */

  // المحفّظون، ومعهم الأمير إذا كان محفّظاً لحلقة
  const teachersOf = users => users.filter(u => u.role === ROLE.TEACHER || S.halaqat.some(h => same(h.teacherId, u.id)));
  const halaqaOf = id => S.halaqat.filter(h => same(h.teacherId, id)).map(h => h.name).join('، ');

  async function pageUsers(main, p, seq) {
    const users = await load('users.list');
    if (stale(seq)) return;
    S.usersCache = users;
    const admin = is(ROLE.ADMIN);
    const tab = admin ? p.tab || 'teachers' : 'teachers';
    const teachers = teachersOf(users);
    const others = users.filter(u => !teachers.includes(u)); // المدير والمحاسب والأمير اللي مش محفّظ
    const tabs = [['teachers', `المحفّظون (${teachers.length})`], ['accounts', `الحسابات الأخرى (${others.length})`]];
    const delBtn = u => same(u.id, S.user.id) ? '' : html`<button class="icon-btn danger" data-act="user-del" data-id="${u.id}" data-name="${u.name}" aria-label="حذف">${icon('trash')}</button>`;
    main.innerHTML = html`
      <div class="page-head">
        <div><h1>المحفّظون</h1><p class="sub">${admin ? 'بيانات المحفّظين وحسابات الدخول للنظام' : `محفّظو الحلقات التي فيها طلاب ${stageName(myStage())}`}</p></div>
        <div class="ph-actions">
          ${tab === 'teachers' && teachers.length ? html`<button class="btn secondary" data-act="export-teachers">${icon('download')}تصدير إلى إكسل</button>` : ''}
          ${!admin ? '' : tab === 'teachers'
            ? html`<button class="btn secondary" data-act="teachers-import">استيراد المحفّظين من إكسل</button>
              <button class="btn" data-act="teacher-new">${icon('plus')}إضافة محفّظ</button>`
            : html`<button class="btn" data-act="user-new">${icon('plus')}إضافة مستخدم</button>`}</div>
      </div>
      ${admin ? html`<nav class="tabs">${tabs.map(t => html`<a href="#" class="${t[0] === tab ? 'active' : ''}" data-go="users" data-params="${params({ tab: t[0] })}">${t[1]}</a>`)}</nav>` : ''}
      ${tab === 'teachers' ? (teachers.length ? html`<div class="table-wrap"><table>
        <thead><tr><th class="idx">#</th><th>اسم المحفّظ</th><th>رقم الجوال</th><th>الحلقة</th><th class="num">أجزاء الحفظ</th><th>طبيعة العمل</th><th>الكفالة</th>${admin ? html`<th>الحساب</th><th></th>` : ''}</tr></thead>
        <tbody>${paged('teachers', teachers).rows.map((u, i) => html`<tr class="click" data-go="teacher" data-params="${params({ id: u.id })}"><td class="idx">${rowNo('teachers', i)}</td>
          <td><strong>${u.name}</strong>${u.role !== ROLE.TEACHER ? html`<small class="cell-sub">${u.role}</small>` : ''}</td>
          <td>${u.phone ? html`<span class="ltr">${u.phone}</span>` : '—'}</td>
          <td>${halaqaOf(u.id) || html`<span class="muted">بدون حلقة</span>`}</td>
          <td class="num">${u.juzCount || '—'}</td><td>${u.workType || '—'}</td><td>${u.kafalaNote || '—'}</td>
          ${admin ? html`<td>${u.active ? chip('فعّال', 'good') : chip('معطّل', 'warn')}</td>
          <td class="actions"><button class="icon-btn" data-act="user-edit" data-id="${u.id}" aria-label="تعديل">${icon('edit')}</button>${delBtn(u)}</td>` : ''}</tr>`)}</tbody>
      </table></div>${paged('teachers', teachers).bar}` : emptyBox(admin ? 'لا يوجد محفّظون بعد. أضفهم واحداً تلو الآخر، أو استورد كشفهم من إكسل.' : 'لا يوجد محفّظون لحلقات مرحلتك.'))
      : html`<p class="sub" style="margin-bottom:12px">يطّلع المدير على جميع البيانات، والمحفّظ على حلقاته فقط، وأمير المرحلة على طلاب مرحلته وحلقاتهم ومحفّظيها (ويعبّئ تقرير حلقته إذا كان محفّظاً لها)، والمحاسب على المالية.</p>

        <thead><tr><th class="idx">#</th><th>الاسم</th><th>اسم المستخدم</th><th>الدور</th><th>رقم الجوال</th><th>الحالة</th><th></th></tr></thead>
        <tbody>${paged('accounts', others).rows.map((u, i) => html`<tr class="click" data-go="teacher" data-params="${params({ id: u.id })}"><td class="idx">${rowNo('accounts', i)}</td>

  }

      title: isNew ? (u.role === ROLE.TEACHER ? 'إضافة محفّظ' : 'إضافة مستخدم') : `تعديل بيانات ${u.name}`,
      cls: 'wide',
      body: html`
        <h3 class="form-sec">الحساب</h3>

  function parseTeachers(text) {
    const { lines, hIdx, H } = readPasted(text, /اسم (المحفظ|المحفّظ|المعلم)/, 'اسم المحفظ');
    const find = re => H.findIndex(h => re.test(h));
    const C = {
      name: find(/اسم (المحفظ|المحفّظ|المعلم)/), mosque: find(/المسجد/), juzCount: find(/أجزاء الحفظ/),
      maritalStatus: find(/الاجتماعية/), workType: find(/طبيعة العمل/), kafalaNote: find(/الكفالة/),
      birthDate: find(/الميلاد/), nationalId: find(/الهوية/), phone: find(/رقم الجوال/), job: find(/^العمل$/),
      housing: find(/البيت|السكن/), bank: find(/بنك/), wallet: find(/محفظة/), payPhone: find(/^جوال$/), course: find(/الدورة/),
    };
    const mobile = v => { const d = toLatin(v).replace(/\D/g, ''); return /^5\d{8}$/.test(d) ? '0' + d : d; };
    const rows = [];
    let badDates = 0;
    lines.slice(hIdx + 1).forEach(r => {
      const get = k => (C[k] < 0 ? '' : (r[C[k]] || '').replace(/\s+/g, ' ').trim());
      const name = get('name');
      if (!name || /اسم (المحفظ|المحفّظ|المعلم)/.test(name)) return;
      const rawBirth = get('birthDate'), birthDate = parseDmy(rawBirth);
      if (rawBirth && !birthDate) badDates++;
      rows.push({
        name, nationalId: toLatin(get('nationalId')).replace(/\D/g, ''), phone: mobile(get('phone')), birthDate,
        juzCount: toLatin(get('juzCount')), mosque: get('mosque'), maritalStatus: get('maritalStatus'), workType: get('workType'),
        kafalaNote: get('kafalaNote'), job: get('job'), housing: get('housing'), bank: get('bank'), wallet: toLatin(get('wallet')),
        payPhone: mobile(get('payPhone')), course: get('course'),
      });
    });
    if (!rows.length) throw new Error('لم يُعثر على محفّظين تحت صف العناوين');
    return { rows, warnings: badDates ? [`${badDates} من تواريخ الميلاد غير واضحة، ولن تُحفظ.`] : [] };
  }

  // الطباعة: بنحط المطلوب بصفحة طباعة نظيفة لحالها (بدون القوائم والنوافذ)، بتشتغل على الجوال والكمبيوتر
  function printHtml(content, wide) {
    let area = document.getElementById('printArea');
    if (!area) {
      area = document.createElement('div');
      area.id = 'printArea';
      document.body.appendChild(area);
    }
    area.className = wide ? 'wide' : '';
    area.innerHTML = String(content);
    document.body.classList.add('printing');
    let cleaned = false;
    const done = () => {
      if (cleaned) return;
      cleaned = true;
      document.body.classList.remove('printing');
      area.innerHTML = '';
      window.removeEventListener('afterprint', done);
    };
    window.addEventListener('afterprint', done);
    // بعض الجوالات ما بتبلّغ بنهاية الطباعة: بننظّف أول ما يرجع المستخدم يلمس الصفحة
    setTimeout(() => ['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, done, { once: true })), 1500);
    window.print();
  }
