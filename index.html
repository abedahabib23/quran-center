<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مركز السلام لتعليم القرآن الكريم</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#285c12">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مركز السلام">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap">
<style>
/* ألوان الشعار: ذهبي القبة، أخضر الأوراق، رمادي الفحم */
:root {
  color-scheme: light;
  --bg: #f3f3f0;
  --surface: #ffffff;
  --surface-2: #f5f5f1;
  --ink: #1c1c1c;
  --ink-2: #3f3e3a;
  --muted: #5f5e58;
  --line: #e0dfd8;
  --line-2: #c9c8c0;

  --green: #3b7b21;
  --green-strong: #285c12;
  --green-wash: #e9f3e1;
  --gold: #fcb813;
  --gold-strong: #e5a300;
  --gold-wash: #fff3cf;

  --good: #2b8a3e;   --good-ink: #1b6a2c;   --good-wash: #e2f2e5;
  --warn: #fcb813;   --warn-ink: #6b4700;   --warn-wash: #fff0c2;
  --bad: #c73434;    --bad-ink: #9e2323;    --bad-wash: #fbe5e5;
  --neutral: #6e6d67; --neutral-ink: #3f3e3a; --neutral-wash: #ebebe6;

  /* تدرّج الحفظ: أخضر واحد من الفاتح للغامق */
  --j0: #f0f0eb;
  --j1: #e0edd3;
  --j2: #c0daa6;
  --j3: #90be6b;
  --j4: #5e9a3b;
  --j5: #3f7d24;

  --radius: 12px;
  --radius-sm: 8px;
  --font: 'Alexandria', system-ui, 'Segoe UI', Tahoma, sans-serif;
  --font-head: 'Alexandria', system-ui, 'Segoe UI', Tahoma, sans-serif;
  --side: 256px;
  --tabbar: 64px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { font-family: var(--font-head); color: var(--ink); margin: 0; line-height: 1.45; }
h1 { font-size: 24px; font-weight: 700; color: var(--green-strong); }
h2 { font-size: 16px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
a { color: var(--green-strong); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.sub { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.muted { color: var(--muted); }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.num { font-variant-numeric: tabular-nums; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i.fill { fill: currentColor; stroke: none; }

/* هيكل التحميل (skeleton) */
.sk { display: inline-block; max-width: 100%; background: linear-gradient(90deg, var(--line) 0%, var(--surface-2) 45%, var(--line) 90%); background-size: 220% 100%; animation: sk 1.3s ease-in-out infinite; }
@keyframes sk { from { background-position: 120% 0; } to { background-position: -120% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
.sk-card { display: grid; gap: 14px; margin-bottom: 14px; }
.sk-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.main { transition: opacity .15s; }
.main.refreshing { opacity: .55; pointer-events: none; }
.btn.ghost.danger-text { color: var(--bad-ink); }
.btn.ghost.danger-text:hover { background: var(--bad-wash); color: var(--bad-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.ph-title h1 .chip { vertical-align: middle; }
.splash, .loading { display: grid; place-items: center; min-height: 40vh; color: var(--muted); font-size: 14px; }
.splash { min-height: 100vh; }
.loading::before {
  content: ''; width: 26px; height: 26px; border-radius: 50%;
  border: 3px solid var(--line); border-top-color: var(--green);
  animation: spin .8s linear infinite; margin-bottom: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .loading::before { animation: none; } }

/* ───────── الإطار ───────── */
.side {
  position: fixed; inset-block: 0; inset-inline-start: 0; width: var(--side);
  background: var(--surface); border-inline-end: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 20px 14px 16px; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 6px 18px; border-bottom: 3px solid var(--gold); margin-bottom: 14px; }
.brand-name { font-family: var(--font-head); font-weight: 700; font-size: 14.5px; line-height: 1.5; color: var(--green-strong); }
.logo { object-fit: contain; flex: none; }
.mark {
  display: inline-grid; place-items: center; flex: none; border-radius: 10px;
  background: var(--gold); color: var(--ink);
}
.mark .i { width: 58%; height: 58%; }
.side-nav { display: grid; gap: 2px; }
.nav-link {
  position: relative; display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 9px; color: var(--ink-2); text-decoration: none;
  font-family: var(--font-head); font-size: 14px; font-weight: 500;
}
.nav-link:hover { background: var(--surface-2); color: var(--ink); }
.nav-link.active { background: var(--green-wash); color: var(--green-strong); }
.nav-link.active::before {
  content: ''; position: absolute; inset-inline-start: -14px; top: 8px; bottom: 8px;
  width: 4px; border-radius: 0 4px 4px 0; background: var(--gold);
}
.side-user { margin-top: auto; border-top: 1px solid var(--line); padding: 14px 6px 0; display: grid; gap: 10px; }
.who { display: flex; align-items: center; gap: 10px; }
.who strong { display: block; font-size: 14px; font-weight: 600; line-height: 1.4; }
.who span { font-size: 12px; color: var(--muted); }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--green-wash); color: var(--green-strong); font-family: var(--font-head); font-weight: 700; font-size: 15px;
  border: 0; cursor: pointer; padding: 0;
}
.side-user .links { display: flex; gap: 6px; flex-wrap: wrap; }

.main { margin-inline-start: var(--side); padding: 28px 36px 56px; max-width: calc(var(--side) + 1160px); }
.topbar, .tabbar { display: none; }

@media (max-width: 959px) {
  .side { display: none; }
  .main { margin: 0; padding: 16px 16px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom)); }
  .topbar {
    display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10;
    background: var(--surface); border-bottom: 3px solid var(--gold); padding: 8px 16px;
  }
  .topbar .brand-name { flex: 1; font-size: 13px; }
  .tabbar {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    position: fixed; inset-inline: 0; bottom: 0; z-index: 10;
    height: calc(var(--tabbar) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface); border-top: 1px solid var(--line);
  }
  .tab {
    display: grid; justify-items: center; align-content: center; gap: 2px;
    color: var(--muted); text-decoration: none; font-size: 11.5px; font-family: var(--font-head);
    background: none; border: 0; cursor: pointer; padding: 0; position: relative;
  }
  .tab.active { color: var(--green-strong); }
  .tab.active::before { content: ''; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }
}

/* ───────── عناصر الصفحة ───────── */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 22px; }
.ph-title { display: flex; align-items: center; gap: 8px; }
.ph-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.section { margin-top: 26px; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 12px; }
.section-head p { color: var(--muted); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
.panel.section { margin-top: 20px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 24px; }
.two-col.wide-first { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .two-col, .two-col.wide-first { grid-template-columns: minmax(0, 1fr); } }

.stats {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px;
  background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
}
.stat { background: var(--surface); padding: 16px 18px; min-width: 0; }
.stat-label { font-size: 13.5px; color: var(--ink-2); font-weight: 500; }
.stat-value { font-family: var(--font-head); font-size: 25px; font-weight: 700; line-height: 1.35; margin-top: 4px; color: var(--ink); }
.stat-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
@media (max-width: 640px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .stat { padding: 12px 14px; }
  .stat-value { font-size: 20px; }
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: var(--radius-sm); border: 1px solid transparent;
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
  background: var(--green); color: #fff;
}
.btn:hover { background: var(--green-strong); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line-2); }
.btn.secondary:hover { background: var(--surface-2); }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.gold { background: var(--gold); color: var(--ink); }
.btn.gold:hover { background: var(--gold-strong); }
.btn.danger { background: var(--bad); }
.btn.danger:hover { background: #a92f2f; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn .i { width: 18px; height: 18px; }
.icon-btn {
  width: 36px; height: 36px; display: inline-grid; place-items: center; flex: none;
  border-radius: 9px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; padding: 0;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.danger:hover { background: var(--bad-wash); color: var(--bad); }
.link-btn { background: none; border: 0; padding: 0; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link-btn:hover { color: var(--ink); }

.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; color: var(--ink-2); font-weight: 500; }
input, select, textarea {
  font: inherit; font-size: 15px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  height: 42px; padding: 0 12px; width: 100%; min-width: 0;
}
textarea { height: auto; min-height: 72px; padding: 10px 12px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--green); outline-offset: -1px; border-color: transparent; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--green); margin: 0; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
.toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
.toolbar .field { flex: 1 1 180px; max-width: 280px; }
.toolbar .field.grow { max-width: none; flex: 2 1 240px; }
.form-error { color: var(--bad-ink); background: var(--bad-wash); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.notice { background: var(--gold-wash); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
.notice.bad { background: var(--bad-wash); color: var(--bad-ink); }
.hint { font-size: 12.5px; color: var(--muted); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg label { position: relative; }
.seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.seg span { display: block; padding: 6px 13px; border-radius: 7px; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; }
.seg input:checked + span { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(59, 59, 59, .12); }
.seg input:focus-visible + span { outline: 2px solid var(--green); outline-offset: -2px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 500; white-space: nowrap; background: var(--neutral-wash); color: var(--neutral-ink);
}
.chip.good { background: var(--good-wash); color: var(--good-ink); }
.chip.warn { background: var(--warn-wash); color: var(--warn-ink); }
.chip.bad { background: var(--bad-wash); color: var(--bad-ink); }
.chip.gold { background: var(--gold-wash); color: var(--warn-ink); }
.chip.green { background: var(--green-wash); color: var(--green-strong); }
.chip .i { width: 14px; height: 14px; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; font-size: 14.5px; }
.row-meta { font-size: 13px; color: var(--muted); }
a.row, button.row { width: 100%; background: none; border-inline: 0; border-bottom: 0; font: inherit; color: inherit; text-align: start; text-decoration: none; cursor: pointer; }
a.row:first-child, button.row:first-child { border-top: 0; }
a.row:hover, button.row:hover { background: var(--surface-2); }
.rank { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-family: var(--font-head); font-size: 13px; font-weight: 700; color: var(--ink-2); flex: none; }
.rank.first { background: var(--gold); color: var(--ink); }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { font-weight: 500; font-size: 13px; color: var(--ink-2); text-align: start; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 160px; }
td.actions { text-align: end; width: 1%; }
td.actions .icon-btn { width: 32px; height: 32px; }
.amount-in { color: var(--good-ink); font-weight: 600; }
.amount-out { color: var(--ink); font-weight: 600; }

.empty { padding: 36px 20px; text-align: center; color: var(--ink-2); display: grid; justify-items: center; gap: 12px; }
.empty.small { padding: 20px; font-size: 14px; }
.list .empty, .table-wrap .empty { background: var(--surface); }

/* ───────── الصفحة الرئيسية ───────── */
.period-card { border-top: 4px solid var(--line-2); }
.period-card.open { border-top-color: var(--gold); }
.period-card .section-head { margin-bottom: 14px; }
.period-card .list .row { flex-wrap: wrap; }
.period-card .row .btn { margin-inline-start: auto; }

/* رسم الأعمدة */
.colchart { padding-top: 6px; }
.cc-plot { display: flex; align-items: stretch; height: 170px; border-bottom: 1px solid var(--line-2); gap: 4px; }
.cc-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; cursor: default; }
.cc-val { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.cc-bars { display: flex; align-items: flex-end; justify-content: center; gap: 2px; width: 100%; height: 100%; max-height: calc(100% - 22px); }
.cc-bar { width: min(24px, 70%); background: var(--green); border-radius: 4px 4px 0 0; min-height: 0; }
.cc-bars.pair .cc-bar { width: min(16px, 40%); }
.cc-bar.gold { background: var(--gold); }
.cc-col:hover .cc-bar { filter: brightness(.9); }
.cc-axis { display: flex; gap: 4px; margin-top: 6px; }
.cc-axis span { flex: 1; text-align: center; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: middle; }

.meter { display: flex; align-items: center; gap: 8px; min-width: 0; }
.meter-track { flex: 1; height: 6px; border-radius: 3px; background: var(--j1); overflow: hidden; min-width: 40px; max-width: 120px; }
.meter-track i { display: block; height: 100%; background: var(--j5); border-radius: 3px; }
.meter span { font-size: 13px; white-space: nowrap; }

/* ───────── التقرير الشهري ───────── */
.notice.ok { background: var(--green-wash); color: var(--green-strong); }
.app-hint { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.app-hint p { margin-top: 2px; font-size: 13.5px; }
.login-app { text-align: center; font-size: 13.5px; color: var(--muted); }
.period-notice { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.period-notice p { margin-top: 2px; font-size: 13.5px; }
.rep { display: grid; gap: 12px; }
.rep-card { margin: 0; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 16px; }
.rep-card legend { display: flex; align-items: center; gap: 10px; float: right; width: 100%; padding: 0 0 12px; font-weight: 700; font-size: 15px; }
.rep-card legend + * { clear: both; }
.rep-num { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--gold-wash); color: var(--warn-ink); font-size: 13px; font-weight: 700; flex: none; }
.rep-fields { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px 12px; }
.rep-fields .span2 { grid-column: span 2; }
.rep-fields .span3 { grid-column: span 3; }
.rep-fields input, .rep-fields select { height: 40px; }
.rep-card[disabled] input, .rep-card[disabled] select { background: var(--surface-2); color: var(--ink); border-color: var(--line); opacity: 1; -webkit-text-fill-color: var(--ink); }
@media (max-width: 1100px) { .rep-fields { grid-template-columns: repeat(4, minmax(0, 1fr)); } .rep-fields .span3 { grid-column: span 4; } }
.rep-card legend { flex-wrap: wrap; }
.rep-before { font-weight: 500; font-size: 13px; color: var(--muted); margin-inline-start: auto; }
.rep-sec { display: grid; gap: 8px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px dashed var(--line); }
.rep-label { font-size: 13.5px; font-weight: 600; color: var(--green-strong); }
.rep-label small { font-weight: 400; color: var(--muted); margin-inline-start: 6px; }
.rep-range { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.rep-point { display: grid; grid-template-columns: auto minmax(0, 1fr) 96px; align-items: center; gap: 8px; }
.rep-point > span { font-size: 13.5px; color: var(--ink-2); min-width: 22px; }
.rep-point select { height: 42px; }
.rep-calc { font-size: 13.5px; color: var(--ink-2); }
.rep-calc.ok { color: var(--green-strong); font-weight: 500; }
.juz-picks { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 4px; }
.juz-picks label { position: relative; }
.juz-picks input { position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.juz-picks span { display: grid; place-items: center; height: 34px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.juz-picks input:checked + span { background: var(--green); border-color: var(--green); color: #fff; }
.juz-picks input:focus-visible + span { outline: 2px solid var(--green); outline-offset: 1px; }
.rep-card[disabled] .juz-picks span { cursor: default; }
@media (max-width: 760px) {
  .rep-range { grid-template-columns: 1fr; }

/* ───────── الطلاب ───────── */

.srow .c-name small { color: var(--muted); font-size: 12.5px; }

.srow .c-status { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }

/* ───────── الصفحات والتحديد الجماعي ───────── */
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 4px 4px; }
.pager-info { font-size: 13.5px; color: var(--muted); }

.pager-btns .btn { min-width: 36px; justify-content: center; }
.pager-gap { color: var(--muted); padding: 0 4px; }
.pager-size { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); }
.pager-size select { height: 32px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); font: inherit; color: var(--ink); }

.bulk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; margin-bottom: 10px; border-radius: 10px; background: var(--green-wash); border: 1px solid var(--line-2); position: sticky; top: 8px; z-index: 5; }

.info { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 12px 0 0; font-size: 14px; }

.modal.narrow { width: min(420px, 100%); }
.modal.wide { width: min(880px, 100%); }
.form-sec { font-size: 15px; color: var(--green-strong); border-bottom: 2px solid var(--gold-wash); padding-bottom: 6px; margin-top: 8px; }

<script>
(function () {
  'use strict';

  /* ═════════ الإعدادات والحالة ═════════ */

  const LOCALE = 'ar-SY-u-nu-latn'; // أسماء الأشهر الشامية بأرقام عادية
  const TOKEN_KEY = 'quran_center_token';
  const LOCAL = 'qc1:'; // بيانات النظام المحفوظة على الجهاز حتى يشتغل بدون إنترنت
  const API_URL = window.API_URL || ''; // نسخة التطبيق المثبّت بتتصل بالسيرفر مباشرة
  const APP_URL = window.APP_URL || ''; // رابط التطبيق اللي بيفتح بدون إنترنت (بيظهر برابط جوجل)
  const standalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };
  // أندرويد: المتصفح بيعرض تثبيت التطبيق، بنحفظ الطلب لزر «تثبيت التطبيق»
  let installPrompt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
  const ROLE = { ADMIN: 'مدير', TEACHER: 'محفظ', ACCOUNTANT: 'محاسب' };
  const AMIRS = ['أمير إبتدائي', 'أمير إعدادي', 'أمير ثانوي']; // أمير المرحلة بيشوف طلاب مرحلته للعرض
  const ALL = [ROLE.ADMIN, ROLE.TEACHER, ROLE.ACCOUNTANT, ...AMIRS];
  const TEACHING = [ROLE.ADMIN, ROLE.TEACHER];
  const VIEW = [...TEACHING, ...AMIRS];
  const FINANCE = [ROLE.ADMIN, ROLE.ACCOUNTANT];
  const ADMIN = [ROLE.ADMIN];
  const STAFF = [ROLE.ADMIN, ...AMIRS]; // المدير وأمراء المراحل: الحلقات والمحفّظون
  const WEEKDAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت']; // حسب getDay()

  const Q = window.QURAN || { surahs: [], juz: [] };

  const S = {
    token: null, user: null, settings: window.PUBLIC || {}, halaqat: [], students: [], teachers: [],

  };
  const app = document.getElementById('app');

  /* ═════════ أدوات ═════════ */

  class Raw { constructor(s) { this.s = s; } toString() { return this.s; } }
  const raw = s => new Raw(String(s));
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const flat = v => v == null || v === false ? '' : v instanceof Raw ? v.s : Array.isArray(v) ? v.map(flat).join('') : esc(v);
  function html(strings, ...vals) {
    let out = strings[0];
    vals.forEach((v, i) => { out += flat(v) + strings[i + 1]; });
    return new Raw(out);
  }
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const same = (a, b) => String(a) === String(b);
  const params = o => JSON.stringify(o);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* خاص */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* خاص */ } },
  };
  const normAr = s => String(s || '').toLowerCase()
    .replace(/[\u064B-\u065F\u0670]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim();

  const nf = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
  const fmtN = v => nf.format(Number(v) || 0);
  const money = v => fmtN(v) + (S.settings.currency ? ' ' + S.settings.currency : '');
  const dLong = new Intl.DateTimeFormat(LOCALE, { day: 'numeric', month: 'long', year: 'numeric' });
  const dShort = new Intl.DateTimeFormat(LOCALE, { day: 'numeric', month: 'short' });
  const dWeek = new Intl.DateTimeFormat(LOCALE, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const dMonth = new Intl.DateTimeFormat(LOCALE, { month: 'long', year: 'numeric' });
  const dMonthShort = new Intl.DateTimeFormat(LOCALE, { month: 'short' });
  const toDate = ymd => new Date(ymd + 'T12:00:00');
  const fDate = ymd => ymd ? dLong.format(toDate(ymd)) : '';
  const fShort = ymd => ymd ? dShort.format(toDate(ymd)) : '';
  const fMonth = ym => dMonth.format(toDate(ym + '-01'));
  function addDays(ymd, n) {
    const d = toDate(ymd); d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function relDay(ymd) {
    if (!ymd) return '';
    if (ymd === S.today) return 'اليوم';
    if (ymd === addDays(S.today, -1)) return 'أمس';
    return fShort(ymd);
  }
  // الأرقام جوّا نص عربي بتنقلب (169-179 بتصير 179-169، و91% بتصير %91)، فبنعزلها باتجاه يسار-يمين
  const iso = s => '\u2066' + s + '\u2069';
  const P = n => iso(n + '%');
  // الأوقات متل 4:00 بتنقلب جوّا النص العربي
  const isoTimes = s => String(s || '').replace(/\d+(?::\d+)+/g, m => iso(m));
  const pct = x => P(Math.round(x * 100));
  const studentsWord = n => (n >= 3 && n <= 10 ? 'طلاب' : 'طالب');
  const nStudents = n => `${fmtN(n)} ${studentsWord(n)}`;
  const juzWord = n => (n >= 3 && n <= 10 ? 'أجزاء' : 'جزء');
  const ayat = n => `${fmtN(n)} ${n >= 3 && n <= 10 ? 'آيات' : 'آية'}`;
  const surahName = n => (Q.surahs[n - 1] || ['؟'])[0];
  const surahLen = n => (Q.surahs[n - 1] || [0, 0])[1];
  const OFFSETS = Q.surahs.reduce((o, x, i) => { o.push(o[i] + x[1]); return o; }, [0]);
  const JUZ_BOUNDS = (Q.juz || []).map(p => OFFSETS[p[0] - 1] + p[1]).map((st, i, arr) => [st, i < arr.length - 1 ? arr[i + 1] - 1 : OFFSETS[114]]);
  const ayahIdx = (su, a) => OFFSETS[su - 1] + a;
  // نفس حساب السيرفر: لما الحفظ نازل بين السور، كل سورة بتنحفظ من أولها
  function rangeInfo(fs_, fa, ts, ta) {
    let segs;
    if (fs_ === ts) segs = [[ayahIdx(fs_, Math.min(fa, ta)), ayahIdx(fs_, Math.max(fa, ta))]];
    else if (fs_ < ts) segs = [[ayahIdx(fs_, fa), ayahIdx(ts, ta)]];
    else {
      segs = [[ayahIdx(fs_, fa), ayahIdx(fs_, surahLen(fs_))]];
      if (fs_ - 1 >= ts + 1) segs.push([ayahIdx(ts + 1, 1), ayahIdx(fs_ - 1, surahLen(fs_ - 1))]);
      segs.push([ayahIdx(ts, 1), ayahIdx(ts, ta)]);
    }
    const juzOf = ([lo, hi]) => JUZ_BOUNDS.reduce((sum, b) => { const l = Math.max(lo, b[0]), h = Math.min(hi, b[1]); return h >= l ? sum + (h - l + 1) / (b[1] - b[0] + 1) : sum; }, 0);
    return { ayat: segs.reduce((n, r) => n + r[1] - r[0] + 1, 0), juz: segs.reduce((n, r) => n + juzOf(r), 0) };
  }
  // «الملك 1-30» أو «الملك 1 إلى القلم 20»
  function rangeText(r) {
    if (!r || !r.fromSurah) return '';
    if (r.fromSurah === r.toSurah) return `${surahName(r.fromSurah)} ${iso(Math.min(r.fromAyah, r.toAyah) + '-' + Math.max(r.fromAyah, r.toAyah))}`;
    return `${surahName(r.fromSurah)} ${r.fromAyah} إلى ${surahName(r.toSurah)} ${r.toAyah}`;
  }
  const initial = name => String(name || '؟').trim().replace(/^(الشيخ|الأستاذة|الأستاذ|أ\.)\s*/, '').charAt(0) || '؟';
  const is = (...roles) => roles.includes(S.user.role);
  const teaches = h => !!h && same(h.teacherId, S.user.id); // هو محفّظ هذه الحلقة (محفّظ أو أمير)
  const upsert = (arr, x) => { const i = arr.findIndex(y => same(y.id, x.id)); if (i >= 0) Object.assign(arr[i], x); else arr.push(x); };
  const halaqaName = id => (S.halaqat.find(h => same(h.id, id)) || {}).name || '';

  function waLink(phone, text) {
    let p = String(phone || '').replace(/[^\d+]/g, '');
    const cc = String(S.settings.countryCode || '').replace(/\D/g, '');
    if (p.startsWith('+')) p = p.slice(1);
    else if (p.startsWith('00')) p = p.slice(2);
    else if (cc && p.startsWith('0')) p = cc + p.slice(1);
    else if (cc && !p.startsWith(cc)) p = cc + p;
    return `https:\/\/wa.me/${p}?text=${encodeURIComponent(text || '')}`;
  }

  const ICONS = {
    home: '<path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>',
    check: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3.5h6V6H9z"/><path d="m9 13 2 2 4-4"/>',
    book: '<path d="M12 6.5C10 5 7 4.5 3.5 4.5v14c3.5 0 6.5.5 8.5 2 2-1.5 5-2 8.5-2v-14C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v14"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M15.5 4.7a3.5 3.5 0 0 1 0 6.6"/><path d="M18 14.8c2 .8 3.2 2.6 3.5 5.2"/>',
    circle: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="7" r="1.6"/><circle cx="7.3" cy="14" r="1.6"/><circle cx="16.7" cy="14" r="1.6"/>',
    wallet: '<path d="M4 7h15a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 19 20H5.5A1.5 1.5 0 0 1 4 18.5V7z"/><path d="M4 7 15 4v3"/><path d="M16 13.5h4.5"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9"/><path d="m16 7 3 3"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/>',
    more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
    logout: '<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="m9 8-4 4 4 4"/><path d="M5 12h10"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    chat: '<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/>',
    trash: '<path d="M4 7h16M9.5 7V4.5h5V7M6 7l1 13h10l1-13"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/>',
    back: '<path d="m9 5 7 7-7 7"/>',
    print: '<path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="8" rx="2"/><path d="M7 14h10v6.5H7z"/>',
    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    lock: '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
    receipt: '<path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
    download: '<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>',
    gift: '<rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5V20h14v-7.5M12 8.5V20"/><path d="M12 8.5C10.5 5 7 4.5 7 6.8S10 8.5 12 8.5zM12 8.5c1.5-3.5 5-4 5-1.7S14 8.5 12 8.5z"/>',
  };
  const icon = (name, cls = '') => raw(`<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`);

  function brandMark(size) {
    const url = S.settings.logoUrl || window.LOGO;
    if (url) return html`<img class="logo" src="${url}" width="${size}" height="${size}" alt="شعار ${S.settings.orgName || ''}">`;
    return html`<span class="mark" style="width:${size}px;height:${size}px">${icon('book')}</span>`;
  }

  /* ═════════ الاتصال بالسيرفر ═════════ */

  const offlineError = () => Object.assign(new Error('لا يوجد اتصال بالإنترنت'), { offline: true });

  function serverCall(fn, ...args) {
    if (navigator.onLine === false) return Promise.reject(offlineError());
    const wait = fn === 'sync' ? 120000 : 60000;
    if (window.google && google.script && google.script.run) {
      return new Promise((resolve, reject) => {
        let done = false;
        const finish = (f, v) => { if (!done) { done = true; clearTimeout(timer); f(v); } };
        const timer = setTimeout(() => finish(reject, offlineError()), wait);
        google.script.run
          .withSuccessHandler(r => finish(resolve, r))
          .withFailureHandler(err => finish(reject, normalizeErr(err)))[fn](...args);
      });
    }
    if (API_URL) return postCall(fn, args, wait);
    return Promise.reject(new Error('افتح النظام من رابط تطبيق الويب'));
  }

  // نسخة التطبيق المثبّت: طلب عادي لرابط تطبيق الويب (doPost بالسيرفر)
  async function postCall(fn, args, wait) {
    const ctrl = window.AbortController ? new AbortController() : null;
    const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, wait);
    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST', body: JSON.stringify({ fn, args }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctrl ? ctrl.signal : undefined,
      });
    } catch (e) {
      clearTimeout(timer);
      throw offlineError();
    }
    let out;
    try { out = await res.json(); } catch (e) { throw new Error('تعذّر الاتصال بالسيرفر، حاول مرة أخرى'); } finally { clearTimeout(timer); }
    if (!out.ok) throw normalizeErr(out.error);
    return out.r;
  }

  function normalizeErr(err) {
    const m = String((err && err.message) || err || 'حدث خطأ غير متوقع').replace(/^(Exception|Error|ScriptError):\s*/i, '');
    if (/NetworkError|HTTP 0|Failed to fetch|connection failure/i.test(m)) return offlineError();
    const e = new Error(m.replace(/^.*?SESSION_EXPIRED:\s*/, ''));
    e.session = /SESSION_EXPIRED/.test(m);
    return e;
  }

  async function call(action, payload) {
    try {
      const r = await serverCall('api', S.token, action, payload || {});
      setOnline(true);
      return r;
    } catch (e) {
      if (e.offline) setOnline(false);
      if (e.session) sessionLost();
      throw e;
    }
  }

  /* ═════════ الحفظ على الجهاز (العمل بدون إنترنت) ═════════ */

  // لكل مستخدم نسخته على الجهاز: آخر بيانات، والصفحات اللي انفتحت، والتعديلات اللي لسا ما انبعتت
  const local = {
    key: (name, uid) => LOCAL + (uid || (S.user && S.user.id)) + ':' + name,
    get(name, uid) { try { const v = localStorage.getItem(this.key(name, uid)); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(name, v) { try { localStorage.setItem(this.key(name), JSON.stringify(v)); return true; } catch (e) { return false; } },
    drop(uid) {
      try { Object.keys(localStorage).filter(k => k.startsWith(LOCAL + uid + ':')).forEach(k => localStorage.removeItem(k)); } catch (e) { /* خاص */ }
      if (useIdb) idb.drop(uid).catch(() => {});
    },
  };

  // نسخ الصفحات بتنحفظ بـ IndexedDB لأنه مساحته كبيرة (localStorage صغير)، وإذا مش متوفر بـ localStorage
  let useIdb = typeof indexedDB !== 'undefined';
  let idbOpen = null;
  const idbDb = () => idbOpen || (idbOpen = new Promise((res, rej) => {
    const r = indexedDB.open('qc-offline', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('reads');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  }));
  const idbRange = uid => IDBKeyRange.bound(uid + '|', uid + '|\uffff');
  const idb = {
    all: uid => idbDb().then(db => new Promise((res, rej) => {
      const r = db.transaction('reads').objectStore('reads').getAll(idbRange(uid));
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    })),
    write: (uid, puts, dels) => idbDb().then(db => new Promise((res, rej) => {
      const t = db.transaction('reads', 'readwrite'), st = t.objectStore('reads');
      puts.forEach(([k, x]) => st.put({ k, v: x.v, t: x.t }, uid + '|' + k));
      dels.forEach(k => st.delete(uid + '|' + k));
      t.oncomplete = () => res();
      t.onerror = t.onabort = () => rej(t.error);
    })),
    drop: uid => idbDb().then(db => new Promise(res => {
      const t = db.transaction('reads', 'readwrite');
      t.objectStore('reads').delete(idbRange(uid));
      t.oncomplete = t.onerror = t.onabort = () => res();
    })),
  };

  // نسخ الصفحات: بتطلع فوراً (حتى بدون إنترنت)، وبالخلفية بنجيب آخر نسخة إذا في اتصال
  const reads = new Map(); // المفتاح ← { v: البيانات, t: وقت جلبها }
  const keyOf = (action, p) => action + '|' + Object.keys(p || {}).filter(k => p[k] !== '' && p[k] != null).sort().map(k => k + '=' + p[k]).join('&');
  const readOf = (action, p) => { const x = reads.get(keyOf(action, p)); return x ? x.v : null; };
  let readsTimer;
  function putRead(key, v) {
    reads.set(key, { v, t: Date.now() });
    saveReadsSoon();
  }
  function saveReadsSoon() { clearTimeout(readsTimer); readsTimer = setTimeout(saveReads, 400); }
  // بنكتب بس الصفحات اللي تغيّرت (بنعرفها من بصمة آخر نسخة انحفظت)
  const savedSig = new Map();
  const sig = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return s.length + ':' + (h >>> 0); };
  function saveReads() {
    if (!S.user) return;
    if (!useIdb) return saveReadsLS();
    const puts = [], dels = [];
    reads.forEach((x, k) => {
      const g = sig(JSON.stringify(x.v));
      if (savedSig.get(k) !== g) { puts.push([k, x]); savedSig.set(k, g); }
    });
    savedSig.forEach((g, k) => { if (!reads.has(k)) { dels.push(k); savedSig.delete(k); } });
    if (puts.length || dels.length) idb.write(S.user.id, puts, dels).catch(() => { useIdb = false; savedSig.clear(); saveReadsLS(); });
  }
  function saveReadsLS() {
    // إذا امتلأت مساحة المتصفح بنحتفظ بالأحدث
    let list = [...reads.entries()].sort((a, b) => b[1].t - a[1].t);
    while (list.length && !local.set('reads', Object.fromEntries(list))) list = list.slice(0, Math.floor(list.length / 2));
  }
  function saveBoot() {
    if (!S.user) return;
    local.set('boot', { user: S.user, settings: S.settings, halaqat: S.halaqat, students: S.students, teachers: S.teachers, lists: S.lists, today: S.today });
  }
  // بعد أي تعديل انعمل على الجهاز
  function commitLocal() { saveBoot(); saveReadsSoon(); }
  async function restoreLocal(uid) {
    reads.clear();
    savedSig.clear();
    outbox = local.get('outbox', uid) || [];
    failed = local.get('failed', uid) || [];
    let rows = null;
    if (useIdb) { try { rows = await idb.all(uid); } catch (e) { useIdb = false; } }
    (rows || []).forEach(r => { reads.set(r.k, { v: r.v, t: r.t }); savedSig.set(r.k, sig(JSON.stringify(r.v))); });
    // نسخة قديمة بـ localStorage (من قبل، أو إذا IndexedDB مش متوفر)
    const old = local.get('reads', uid);
    if (old) {
      Object.entries(old).forEach(([k, x]) => { if (!reads.has(k)) reads.set(k, x); });
      if (useIdb) { try { localStorage.removeItem(local.key('reads', uid)); } catch (e) { /* خاص */ } }
    }
  }
  // بنعدّل نسخ الصفحات المحفوظة بعد تعديل انعمل على الجهاز
  function patchReads(action, fn) {
    reads.forEach((x, k) => { if (k.startsWith(action + '|')) fn(x.v, k); });
    saveReadsSoon();
  }

  const STALE_MS = 20000;
  const inflight = new Set();
  function load(action, payload) {
    const key = keyOf(action, payload);
    const hit = reads.get(key);
    if (hit) {
      if (Date.now() - hit.t > STALE_MS) revalidate(key, action, payload, S.seq);
      return Promise.resolve(hit.v);
    }
    return call(action, payload).then(v => { putRead(key, v); return v; }, e => {
      if (e.offline) throw new Error('لا يوجد اتصال بالإنترنت، وهذه الصفحة غير محفوظة على الجهاز بعد. افتحها مرة واحدة وأنت متصل لتعمل بعدها دون إنترنت.');
      throw e;
    });
  }
  // آخر نسخة بالخلفية، وإذا تغيّر شي بنحدّث الصفحة بمكانها
  function revalidate(key, action, payload, seq) {
    if (inflight.has(key) || outbox.length || flushing || !online) return;
    inflight.add(key);
    call(action, payload).then(v => {
      if (outbox.length) return; // في تعديلات على الجهاز لسا ما انبعتت، فنسختنا أحدث
      const old = reads.get(key);
      putRead(key, v);
      if (old && JSON.stringify(old.v) === JSON.stringify(v)) return;
      if (seq === S.seq) quietRender();
    }).catch(() => {}).finally(() => inflight.delete(key));
  }
  // جلب مسبق بالخلفية حتى تفتح الصفحات فوراً وبدون إنترنت
  function prefetch(action, payload) {
    const key = keyOf(action, payload);
    const hit = reads.get(key);
    if ((hit && Date.now() - hit.t < STALE_MS) || inflight.has(key) || !online) return;
    inflight.add(key);
    call(action, payload).then(v => { if (!outbox.length) putRead(key, v); }).catch(() => {}).finally(() => inflight.delete(key));
  }

  /* ═════════ التعديلات بدون إنترنت والمزامنة ═════════ */

  let outbox = [], failed = [], flushing = false, online = navigator.onLine !== false, flushTimer, lastSync = 0;
  const aliases = {}; // رقم مؤقت ← الرقم الحقيقي بالشيت
  const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const tempId = kind => newId('~' + kind);
  const isTemp = id => String(id).startsWith('~');
  const pad2 = n => String(n).padStart(2, '0');
  const dayOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const deviceDay = () => dayOf(new Date());
  const stampOf = ms => { const d = new Date(ms); return dayOf(d) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
  const nowStamp = () => stampOf(Date.now());
  const pendingText = n => (n === 1 ? 'تعديل واحد' : n === 2 ? 'تعديلان' : `${fmtN(n)} ${n <= 10 ? 'تعديلات' : 'تعديلاً'}`);
  // بدون إنترنت بنوضّح إنه التعديل محفوظ على الجهاز
  const savedMsg = msg => (online ? msg : msg + ' على هذا الجهاز، وسيُحدَّث الشيت تلقائياً عند عودة الإنترنت');

  function saveOutbox() {
    if (!local.set('outbox', outbox)) {
      // المساحة امتلأت: التعديلات أهم من نسخ الصفحات
      try { localStorage.removeItem(local.key('reads')); } catch (e) { /* خاص */ }
      local.set('outbox', outbox);
    }
    local.set('failed', failed);
    renderSync();
  }

  // كل تعديل بينحفظ على الجهاز أولاً وبيظهر فوراً، وبينبعت للشيت بالخلفية
  function mutate(action, payload, o = {}) {
    let p = JSON.stringify(payload);
    Object.keys(aliases).forEach(t => { p = p.split(JSON.stringify(t)).join(JSON.stringify(aliases[t])); });
    outbox.push({ op: newId('op'), action, payload: JSON.parse(p), tempId: o.tempId || '', day: deviceDay(), label: o.label || '', at: Date.now() });
    saveOutbox();
    flushSoon(30);
  }

  function flushSoon(ms) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }

  async function flush() {
    if (flushing || !S.token || !S.user || !outbox.length) return;
    flushing = true;
    renderSync();
    let sent = false;
    try {
      while (outbox.length) {
        const batch = outbox.slice(0, 20);
        let res;
        try {
          res = await serverCall('sync', S.token, batch.map(o => ({ op: o.op, action: o.action, payload: o.payload, tempId: o.tempId, day: o.day })));
        } catch (e) {
          if (e.offline) setOnline(false);
          else if (e.session) sessionLost();
          else flushSoon(30000); // خطأ بالسيرفر: بنعيد المحاولة بعد شوي
          break;
        }
        setOnline(true);
        Object.keys(res.idMap || {}).forEach(t => remapId(t, res.idMap[t]));
        let retry = false;
        res.results.forEach(r => {
          if (r.retry) { retry = true; return; }
          const i = outbox.findIndex(o => o.op === r.op);
          if (i < 0) return;
          const o = outbox.splice(i, 1)[0];
          sent = true;
          if (!r.ok) failed.push({ label: o.label || o.action, error: r.error, at: Date.now() });
        });
        saveOutbox();
        if (retry || !res.results.length) { flushSoon(20000); break; }
      }
    } finally {
      flushing = false;
      renderSync();
    }
    if (sent && !outbox.length) afterSync();
  }

  // تجهيز كل النظام على الجهاز: كل الصفحات اللي بيقدر يفتحها المستخدم بطلب واحد،
  // فبيشتغل كله بدون إنترنت بدون ما يحتاج يفتح كل صفحة قبل
  const PACK_EVERY = 15 * 60 * 1000;
  let packing = false;
  async function packAll(force) {
    if (packing || !S.user || !S.token || !online || outbox.length) return;
    const last = Number(local.get('packedAt')) || 0;
    if (!force && Date.now() - last < PACK_EVERY) return;
    packing = true;
    renderSync();
    try {
      const r = await call('offline.pack');
      if (outbox.length || !S.user) return;
      const now = Date.now();
      Object.keys(r.data).forEach(k => reads.set(k, { v: r.data[k], t: now }));
      saveReadsSoon();
      local.set('packedAt', now);
      if (!last) toast('النظام جاهز للعمل دون إنترنت على هذا الجهاز');
      quietRender();
    } catch (e) { /* بنحاول لاحقاً */ } finally {
      packing = false;
      renderSync();
    }
  }

  // السجل اللي انعمل على الجهاز أخد رقمه الحقيقي بالشيت، فبنبدّل الرقم المؤقت بكل مكان
  function remapId(tmp, real) {
    aliases[tmp] = real;
    const from = JSON.stringify(tmp), to = JSON.stringify(real);
    const swap = v => JSON.parse(JSON.stringify(v).split(from).join(to));
    outbox = swap(outbox);
    ['students', 'halaqat', 'teachers', 'params'].forEach(k => { S[k] = swap(S[k]); });
    [...reads.keys()].forEach(k => {
      const x = reads.get(k);
      reads.delete(k);
      reads.set(k.split('=' + tmp).join('=' + real), { v: swap(x.v), t: x.t });
    });
    S.studentList = readOf('students.list', {});
    commitLocal();
  }

  // بعد ما انبعت كل شي: بنجيب آخر نسخة من السيرفر بالخلفية
  function afterSync() {
    lastSync = Date.now();
    reads.forEach(x => { x.t = 0; }); // كل النسخ بتتحدّث أول ما تنفتح
    refreshFromServer();
    setTimeout(() => packAll(true), 4000);
    if (failed.length) toast(`تعذّر حفظ ${pendingText(failed.length)} في الشيت. اضغط على مؤشر المزامنة لمعرفة السبب.`, 'error');
  }

  let refreshingAll = false;
  async function refreshFromServer() {
    if (refreshingAll || !S.token || !S.user || outbox.length || !online) return;
    refreshingAll = true;
    try {
      const d = await call('bootstrap', { home: true });
      if (outbox.length || !S.user) return;
      const shell = u => JSON.stringify([u.role, u.name]);
      const changed = shell(d.user) !== shell(S.user);
      applyBootstrap(d);
      if (changed) { renderShell(); go(S.route, S.params, 'none'); } else quietRender();
      prefetchOffline();
    } catch (e) { /* بنحاول لاحقاً */ } finally { refreshingAll = false; }
  }

  // تحديث الصفحة الحالية بمكانها من النسخة المحفوظة (بدون ما تفضى أو تطلع لفوق)
  function quietRender() {
    if (!S.user || !$('#main') || !safeToRender()) return;
    go(S.route, S.params, 'none', true);
  }
  // ما منحدّث الصفحة إذا المستخدم عم يكتب أو فاتح نافذة
  function safeToRender() {
    if (modal) return false;
    const a = document.activeElement;
    if (a && a.closest && a.closest('#main') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return false;
    return !$('form.rep.dirty');
  }
  // بعد الحفظ من نافذة: بنحدّث الصفحة بعد ما تتسكّر النافذة
  const refreshView = () => setTimeout(() => { if (S.user && !modal) go(S.route, S.params, 'none', true); }, 0);

  // الجلسة انتهت على السيرفر: التعديلات بتضل محفوظة على الجهاز لحتى يرجع يسجّل دخول
  function sessionLost() {
    if (!S.user) return;
    const n = outbox.length;
    store.del(TOKEN_KEY);
    S.token = null;
    closeModal();
    showLogin(n ? `انتهت الجلسة. سجّل الدخول من جديد لإرسال ${pendingText(n)} محفوظة على هذا الجهاز.` : 'انتهت الجلسة، سجّل الدخول من جديد.');
  }

  function setOnline(v) {
    if (online === v) return;
    online = v;
    renderSync();
    if (v) {
      flushSoon(0);
      if (!outbox.length && Date.now() - lastSync > 5000) refreshFromServer();
    }
  }
  const ping = () => serverCall('ping').then(() => setOnline(true), e => { if (e.offline) setOnline(false); });

  function wireNetwork() {
    window.addEventListener('online', ping);
    window.addEventListener('offline', () => setOnline(false));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden || !S.user) return;
      if (outbox.length) flushSoon(0);
      else if (online) quietRender();
      else ping();
    });
    // كل 20 ثانية: إذا في تعديلات بنحاول نبعتها، وإذا ما في اتصال بنفحص إذا رجع
    setInterval(() => {
      if (!S.user) return;
      if (outbox.length) flush();
      else if (!online) ping();
    }, 20000);
  }

  // مؤشر صغير: دون اتصال، أو عم يبعت، أو في تعديلات ما انحفظت
  function renderSync() {
    let el = document.getElementById('syncPill');
    if (!el) {
      el = document.createElement('button');
      el.id = 'syncPill';
      el.type = 'button';
      el.dataset.act = 'sync';
      document.body.appendChild(el);
    }
    let text = '', kind = '';
    if (!S.user) text = '';
    else if (failed.length) { text = `تعذّر حفظ ${pendingText(failed.length)}`; kind = 'bad'; }
    else if (flushing) { text = 'جارٍ إرسال التعديلات…'; kind = 'busy'; }
    else if (!online) { text = outbox.length ? `دون اتصال، ${pendingText(outbox.length)} على الجهاز` : 'دون اتصال بالإنترنت'; kind = 'off'; }
    else if (outbox.length) { text = `${pendingText(outbox.length)} بانتظار الإرسال`; kind = 'busy'; }
    else if (packing && !local.get('packedAt')) { text = 'جارٍ تجهيز النظام للعمل دون إنترنت…'; kind = 'busy'; }
    el.hidden = !text;
    el.className = 'sync-pill ' + kind;
    el.innerHTML = text ? html`<span class="dot" aria-hidden="true"></span>${text}` : '';
  }

  function syncSheet() {
    const when = ms => { const s = stampOf(ms); return relDay(s.slice(0, 10)) + ' ' + iso(s.slice(11)); };
    openModal({
      title: 'المزامنة مع الشيت',
      cls: 'narrow',
      body: html`
        <p class="notice ${online ? 'ok' : ''}">${online
          ? 'متصل بالإنترنت، وتُرسل التعديلات إلى الشيت تلقائياً.'
          : 'لا يوجد اتصال بالإنترنت. تابع عملك كالمعتاد: تُحفظ التعديلات على هذا الجهاز وتُرسل تلقائياً عند عودة الاتصال.'}</p>
        <p class="hint">${local.get('packedAt') ? `جميع صفحات النظام محفوظة على هذا الجهاز وتعمل دون إنترنت (آخر تحديث ${when(Number(local.get('packedAt')))}).`
          : 'لم تُحفظ صفحات النظام على هذا الجهاز بعد، وتُحفظ تلقائياً عند الاتصال بالإنترنت.'}</p>
        ${outbox.length ? html`<h3 class="form-sec">بانتظار الإرسال (${fmtN(outbox.length)})</h3>
          <ul class="sync-list">${outbox.map(o => html`<li><span>${o.label || o.action}</span><small>${when(o.at)}</small></li>`)}</ul>`
          : html`<p class="muted">لا توجد تعديلات بانتظار الإرسال.</p>`}
        ${failed.length ? html`<h3 class="form-sec">لم تُحفظ في الشيت (${fmtN(failed.length)})</h3>
          <ul class="sync-list bad">${failed.map(f => html`<li><span>${f.label}</span><small>${f.error}</small></li>`)}</ul>
          <p class="hint">صحّح البيانات وأعد حفظها، ثم امسح هذه القائمة.</p>` : ''}`,
      submitLabel: outbox.length ? 'إرسال الآن' : failed.length ? 'مسح القائمة' : 'حسناً',
      onSubmit: async () => {
        if (outbox.length) {
          await flush();
          if (outbox.length) throw new Error(online ? 'تعذّر الإرسال الآن، وستُعاد المحاولة تلقائياً.' : 'لا يوجد اتصال بالإنترنت بعد.');
          return;
        }
        if (failed.length) { failed = []; saveOutbox(); }
      },
    });
  }

  // بيجهّز كل صفحات النظام على الجهاز إذا صار وقتها
  function prefetchOffline() { packAll(false); }

  let toastTimer;
  function toast(msg, kind) {
    const el = $('#toast');
    el.textContent = msg;
    el.className = 'toast show ' + (kind || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast'; }, kind === 'error' ? 5000 : 3000);
  }

  /* ═════════ الدخول ═════════ */

  async function boot() {
    wireEvents();
    wireNetwork();
    S.token = store.get(TOKEN_KEY);
    let last = null;
    try { last = JSON.parse(store.get(LOCAL + 'last') || 'null'); } catch (e) { /* قديمة */ }
    // نسخة الجهاز بس لنفس الجلسة اللي حفظتها
    const saved = S.token && last && last.token === S.token ? local.get('boot', last.uid) : null;
    if (saved) {
      // بيفتح فوراً من نسخة الجهاز (حتى بدون إنترنت)، وبالخلفية بنبعت التعديلات ونجيب آخر نسخة
      await restoreLocal(last.uid);
      applyBootstrap(saved, true);
      startApp();
      flush();
      refreshFromServer();
      return;
    }
    if (!S.token) return showLogin();
    try {
      const d = await call('bootstrap', { home: true });
      await restoreLocal(d.user.id);
      applyBootstrap(d);
      startApp();
      prefetchOffline();
    } catch (e) {
      showLogin(e.offline ? 'لا يوجد اتصال بالإنترنت. سجّل الدخول عند عودة الاتصال.' : e.session ? '' : e.message);
    }
  }

  function applyBootstrap(d, fromDevice) {
    Object.assign(S, {
      user: d.user, settings: d.settings, halaqat: d.halaqat, students: d.students,
      teachers: d.teachers, lists: d.lists, today: fromDevice ? deviceDay() : d.today,
    });
    document.title = d.settings.orgName;
    store.set(LOCAL + 'last', JSON.stringify({ uid: d.user.id, token: S.token }));
    if (d.home) putRead(keyOf('dashboard', {}), d.home);
    if (!fromDevice) saveBoot();
  }

  function showLogin(msg) {
    S.user = null;
    renderSync();
    app.innerHTML = html`
      <div class="login">
        <form class="login-card" data-form="login">
          <div class="login-brand">
            ${brandMark(132)}
            <h1>${S.settings.orgName || 'نظام التحفيظ'}</h1>
            <p>سجّل دخولك لمتابعة الحلقات والحفظ</p>
          </div>
          ${msg ? html`<p class="notice">${msg}</p>` : ''}
          <label class="field"><span>رقم الهوية (اسم المستخدم)</span>
            <input name="username" inputmode="numeric" autocomplete="username" required dir="ltr" autocapitalize="none" spellcheck="false"></label>
          <label class="field"><span>كلمة المرور</span>
            <input name="password" type="password" autocomplete="current-password" required dir="ltr"></label>
          <p class="form-error" hidden></p>
          <button class="btn block" type="submit">دخول</button>
          ${APP_URL && !API_URL ? html`<p class="login-app">للعمل دون إنترنت: <a href="${APP_URL}" target="_blank" rel="noopener">افتح النظام كتطبيق</a></p>` : ''}
          <div class="login-foot"></div>
        </form>
      </div>`;
    setTimeout(() => { const u = $('[name=username]'); if (u) u.focus(); }, 50);
  }

  async function submitLogin(form) {
    const btn = $('button[type=submit]', form), err = $('.form-error', form);
    btn.disabled = true; btn.textContent = 'جارٍ الدخول…'; err.hidden = true;
    try {
      const r = await serverCall('login', form.username.value, form.password.value);
      S.token = r.token;
      store.set(TOKEN_KEY, r.token);
      setOnline(true);
      await restoreLocal(r.data.user.id);
      applyBootstrap(r.data);
      startApp();
      flush();
      prefetchOffline();
    } catch (e) {
      err.textContent = e.offline ? 'تسجيل الدخول يحتاج إلى اتصال بالإنترنت، وبعد الدخول يمكنك العمل دون اتصال.' : e.message;
      err.hidden = false;
      btn.disabled = false; btn.textContent = 'دخول';
    }
  }

  async function signOut() {
    if (outbox.length && !(await confirmBox(`لديك ${pendingText(outbox.length)} لم تُرسل إلى الشيت بعد، وستُحذف من هذا الجهاز إذا خرجت الآن. انتظر عودة الإنترنت حتى تُرسل، ثم اخرج.`, 'خروج وحذف التعديلات'))) return;
    if (S.token) serverCall('logout', S.token).catch(() => {});
    // بيانات الطلاب ما بتضل على الجهاز بعد الخروج
    if (S.user) local.drop(S.user.id);
    store.del(TOKEN_KEY);
    store.del(LOCAL + 'last');
    S.token = null;
    outbox = []; failed = []; reads.clear();
    closeModal();
    showLogin();
  }

  /* ═════════ الصفحات والتنقل ═════════ */

  const PAGES = {
    home: { title: 'الرئيسية', icon: 'home', roles: ALL, render: pageHome },
    reports: { title: 'التقارير', icon: 'check', roles: VIEW, render: pageReports },
    report: { hidden: true, parent: 'reports', roles: VIEW, render: pageReport },
    students: { title: 'الطلاب', icon: 'users', roles: VIEW, render: pageStudents },
    student: { hidden: true, parent: 'students', roles: VIEW, render: pageStudent },
    halaqat: { title: 'الحلقات', icon: 'circle', roles: STAFF, render: pageHalaqat },
    halaqa: { hidden: true, parent: 'halaqat', roles: VIEW, render: pageHalaqa },
    teacher: { hidden: true, parent: 'users', roles: STAFF, render: pageTeacher },
    finance: { title: 'المالية', icon: 'wallet', roles: FINANCE, render: pageFinance },
    users: { title: 'المحفّظون', icon: 'key', roles: STAFF, render: pageUsers },
  };
  const isAmir = () => AMIRS.includes(S.user.role);
  const myStage = () => S.user.role.replace(/^أمير /, '');
  const stageName = st => st ? 'المرحلة ال' + st + 'ة' : '';
  const pageTitle = k => k === 'students' && is(ROLE.TEACHER) ? 'طلابي' : k === 'students' && isAmir() ? 'طلاب ' + stageName(myStage())
    : k === 'reports' && is(ROLE.TEACHER) ? 'التقرير الشهري' : PAGES[k].title;
  const navPages = () => Object.keys(PAGES).filter(k => !PAGES[k].hidden && PAGES[k].roles.includes(S.user.role));

  function startApp() {
    renderShell();
    if (S.user.mustChange) setTimeout(() => passwordForm(true), 300);
    const hist = window.google && google.script && google.script.history;
    if (hist) hist.setChangeHandler(e => { if (e.state && e.state.route) go(e.state.route, e.state.params || {}, 'none'); });
    else window.onpopstate = e => { if (e.state && e.state.route) go(e.state.route, e.state.params || {}, 'none'); };
    go('home', {}, 'replace');
  }

  function renderShell() {
    const pages = navPages();
    const tabs = pages.length > 5 ? pages.slice(0, 4) : pages;
    app.innerHTML = html`
      <aside class="side">
        <div class="brand">${brandMark(44)}<div class="brand-name">${S.settings.orgName}</div></div>
        <nav class="side-nav" aria-label="القائمة الرئيسية">
          ${pages.map(k => html`<a href="#" class="nav-link" data-go="${k}">${icon(PAGES[k].icon)}<span>${pageTitle(k)}</span></a>`)}
        </nav>
        <div class="side-user">
          <div class="who"><span class="avatar" aria-hidden="true">${initial(S.user.name)}</span>
            <div><strong>${S.user.name}</strong><span>${S.user.role}</span></div></div>
          <div class="links">
            <button class="btn ghost sm" data-act="password">${icon('lock')}كلمة المرور</button>
            <button class="btn ghost sm" data-act="logout">${icon('logout')}خروج</button>
          </div>
        </div>
      </aside>
      <header class="topbar">
        ${brandMark(34)}<div class="brand-name">${S.settings.orgName}</div>
        <button class="avatar" data-act="account" aria-label="حسابي">${initial(S.user.name)}</button>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
      <nav class="tabbar" aria-label="القائمة">
        ${tabs.map(k => html`<a href="#" class="tab" data-go="${k}">${icon(PAGES[k].icon)}<span>${pageTitle(k)}</span></a>`)}
        ${pages.length > 5 ? html`<button class="tab" data-act="more">${icon('more', 'fill')}<span>المزيد</span></button>` : ''}
      </nav>`;
  }

  // هيكل رمادي بشكل الصفحة لحتى توصل البيانات
  function skeleton(route) {
    const bar = (w, h = 14, r = 6) => `<span class="sk" style="width:${w};height:${h}px;border-radius:${r}px"></span>`;
    const head = `<div class="page-head"><div style="display:grid;gap:10px;width:100%">${bar('min(260px,70%)', 28)}${bar('min(180px,50%)')}</div></div>`;
    const stats = `<div class="stats">${Array(4).fill(`<div class="stat" style="display:grid;gap:12px">${bar('55%', 12)}${bar('40%', 26)}${bar('70%', 10)}</div>`).join('')}</div>`;
    const rows = n => `<div class="list">${Array(n).fill(`<div class="row">${bar('36px', 36, 18)}<div style="flex:1;display:grid;gap:8px">${bar('45%')}${bar('28%', 11)}</div>${bar('72px', 24, 12)}</div>`).join('')}</div>`;
    const cards = n => Array(n).fill(`<div class="panel sk-card">${bar('35%', 16)}<div class="sk-grid">${Array(6).fill(bar('100%', 40, 8)).join('')}</div></div>`).join('');
    const tools = `<div class="toolbar">${bar('min(320px,100%)', 42, 8)}${bar('160px', 42, 8)}</div>`;
    let body;
    if (route === 'report') body = cards(3);
    else if (route === 'home') body = `<div class="panel sk-card">${bar('40%', 18)}${rows(3)}</div>` + stats;
    else if (['student', 'teacher', 'halaqa'].includes(route)) body = stats + `<div class="section">${rows(5)}</div>`;
    else body = tools + rows(8);
    return `<div aria-busy="true" aria-label="جارٍ التحميل">${head}${body}</div>`;
  }

  function go(route, p = {}, mode = 'push', soft = false) {
    const page = PAGES[route];
    if (!page || !page.roles.includes(S.user.role)) { route = 'home'; p = {}; }
    if (mode !== 'none') S.pages = {}; // صفحة جديدة بتبدأ جداولها من أول صفحة
    S.route = route; S.params = p;
    const state = { route, params: p };
    try {
      const hist = window.google && google.script && google.script.history;
      if (mode === 'push') hist ? hist.push(state, null, route) : history.pushState(state, '', '#' + route);
      if (mode === 'replace') hist ? hist.replace(state, null, route) : history.replaceState(state, '', '#' + route);
    } catch (e) { /* التاريخ مش ضروري */ }
    const active = PAGES[route].parent || route;
    $$('[data-go]').forEach(a => a.classList.toggle('active', a.dataset.go === active && !a.dataset.params));
    const main = $('#main');
    const seq = ++S.seq;
    const y = window.scrollY;
    clearTimeout(dimTimer);
    // التحديث بمكانه: الصفحة بتضل ظاهرة بنفس مكانها، وبس إذا طوّل الجلب بنبهّتها شوي
    if (soft && main.children.length) dimTimer = setTimeout(() => { if (seq === S.seq) main.classList.add('refreshing'); }, 400);
    else {
      main.classList.remove('refreshing');
      main.innerHTML = skeleton(route);
      window.scrollTo(0, 0);
    }
    const done = () => { if (seq === S.seq) { clearTimeout(dimTimer); main.classList.remove('refreshing'); } };
    Promise.resolve(PAGES[route].render(main, p, seq))
      .then(() => { done(); if (soft && seq === S.seq) window.scrollTo(0, y); })
      .catch(e => {
        if (seq !== S.seq) return;
        done();
        main.innerHTML = html`<div class="empty">${e.message}<button class="btn secondary sm" data-act="reload">إعادة المحاولة</button></div>`;
      });
  }
  let dimTimer;
  const stale = seq => seq !== S.seq;
  const reload = () => go(S.route, S.params, 'none', true);

  /* ═════════ مكوّنات ═════════ */

  const stat = (label, value, sub) => html`<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub ? html`<div class="stat-sub">${sub}</div>` : ''}</div>`;
  const chip = (text, kind = '') => html`<span class="chip ${kind}">${text}</span>`;
  const GRADE_KIND = { 'ممتاز': 'good', 'جيد جداً': 'good', 'جيد': '', 'مقبول': 'warn', 'ضعيف': 'bad' };
  const STATUS_KIND = { 'فعّال': 'good', 'متوقف': 'warn', 'منسحب': '', 'خاتم': 'gold' };
  const rateChip = r => r == null ? chip('لا يوجد', '') : chip(P(r), r >= 85 ? 'good' : r >= 70 ? '' : 'bad');
  const option = (value, label, selected) => html`<option value="${value}" ${same(value, selected) ? raw('selected') : ''}>${label}</option>`;
  const options = (list, selected) => list.map(v => option(v, v, selected));

  function seg(name, list, selected, cls = '') {
    return html`<div class="seg ${cls}" role="radiogroup">${list.map(v => html`
      <label><input type="radio" name="${name}" value="${v}" ${v === selected ? raw('checked') : ''}><span>${v}</span></label>`)}</div>`;
  }

  // مقياس أجزاء الحفظ من 30
  const juzMeter = juz => juz === '' || juz == null ? html`<span class="muted">—</span>`
    : html`<div class="meter"><div class="meter-track"><i style="width:${Math.min(100, (Number(juz) / 30) * 100)}%"></i></div><span>${fmtN(juz)} ${juzWord(juz)}</span></div>`;

  // أعمدة بسيطة: عمود لكل فترة، الأقدم على اليمين
  function colChart(items, opts = {}) {
    const series = opts.series || [{ key: 'value', cls: '' }];
    const max = Math.max(1, ...items.flatMap(it => series.map(s => it[s.key] || 0)));
    return html`<div class="colchart" role="img" aria-label="${opts.label || ''}">
      <div class="cc-plot">${items.map(it => html`
        <div class="cc-col" data-tip="${it.tip}">
          ${series.length === 1 ? html`<span class="cc-val">${fmtN(it[series[0].key])}</span>` : ''}
          <div class="cc-bars ${series.length > 1 ? 'pair' : ''}">${series.map(s => html`<span class="cc-bar ${s.cls}" style="height:${((it[s.key] || 0) / max) * 100}%"></span>`)}</div>
        </div>`)}</div>
      <div class="cc-axis">${items.map(it => html`<span>${it.label}</span>`)}</div>
    </div>`;
  }

  const emptyBox = (text, action) => html`<div class="empty">${text}${action || ''}</div>`;

  // تقسيم الجداول الطويلة لصفحات: paged(المفتاح، الصفوف) بيرجّع صفوف الصفحة الحالية وأزرار التنقل
  const PAGE_SIZES = [25, 50, 100];
  let pageSize = PAGE_SIZES.includes(Number(store.get('qc_page_size'))) ? Number(store.get('qc_page_size')) : 25;
  function paged(key, rows) {
    const pages = Math.max(1, Math.ceil(rows.length / pageSize));
    const cur = Math.min(Math.max(1, S.pages[key] || 1), pages);
    S.pages[key] = cur;
    const from = (cur - 1) * pageSize;
    return { rows: rows.slice(from, from + pageSize), bar: rows.length > PAGE_SIZES[0] ? pagerBar(key, cur, pages, rows.length, from) : '' };
  }
  // رقم الصف متسلسل عبر الصفحات
  const rowNo = (key, i) => ((S.pages[key] || 1) - 1) * pageSize + i + 1;
  function pagerBar(key, cur, pages, total, from) {
    const nums = [];
    for (let i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - cur) <= 1) nums.push(i);
      else if (nums[nums.length - 1] !== '…') nums.push('…');
    }
    const btn = (n, label, off) => html`<button type="button" class="btn sm ${n === cur && !label ? '' : 'ghost'}" data-act="page" data-key="${key}" data-page="${n}"
      ${off ? raw('disabled') : ''} ${n === cur && !label ? raw('aria-current="page"') : ''}>${label || n}</button>`;
    return html`<nav class="pager" data-pager="${key}" aria-label="الصفحات">
      <span class="pager-info">${iso(fmtN(from + 1) + '–' + fmtN(Math.min(total, from + pageSize)))} من ${fmtN(total)}</span>
      <div class="pager-btns">${btn(cur - 1, 'السابق', cur === 1)}${nums.map(n => n === '…' ? html`<span class="pager-gap">…</span>` : btn(n))}${btn(cur + 1, 'التالي', cur === pages)}</div>
      <label class="pager-size"><span>عدد الصفوف</span><select data-change="page-size">${PAGE_SIZES.map(n => option(n, n, pageSize))}</select></label>
    </nav>`;
  }
  // بعد تغيير الصفحة: بنرسم الجدول من جديد وبنطلع لأوله
  function repage(key) {
    if (key === 'students') renderStudentRows(); else go(S.route, S.params, 'none', true);
    setTimeout(() => {
      const bar = document.querySelector(`[data-pager="${key}"]`);
      const top = key === 'students' ? $('#stList') : bar && bar.previousElementSibling;
      if (top && top.getBoundingClientRect().top < 60) top.scrollIntoView({ block: 'start' });
    }, 30);
  }

  /* ═════════ الرئيسية ═════════ */

  async function pageHome(main, p, seq) {
    const d = await load('dashboard');
    if (stale(seq)) return;
    main.innerHTML = html`
      <div class="page-head"><div><h1>أهلاً ${S.user.name}</h1><p class="sub">${dWeek.format(toDate(S.today))}</p></div></div>
      ${appHint()}
      ${d.teaching ? homeTeaching(d.teaching) : ''}
      ${d.finance ? homeFinance(d.finance, !d.teaching) : ''}`;
